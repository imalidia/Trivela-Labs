,wght@1,900&family=Righteous&family=Shrikhand&family=VT323&text=differently.&display=swap\">\n<style>\n/* Concept: one teal world. Deep logo-teal hero with a live tracking canvas, white sheet sliding over it, a dark-teal showcase, white stats, teal call to action. Pitch center-circle arcs repeat as the one decorative motif. */\n:root {\n  --teal:#015C55; --teal-700:#014B45; --teal-900:#012F2B; --teal-500:#0B8478;\n  --mint:#8FE8DA; --mint-soft:#D3F5EF; --paper:#F2F8F7; --white:#FFFFFF;\n  --ink:#06201D; --ink-2:#4A6663; --line:rgba(1,92,85,.14); --ball:#FFD60A;\n  --display:\"Bricolage Grotesque\",\"Avenir Next\",\"Segoe UI\",system-ui,sans-serif;\n  --body:\"DM Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1); --ease:var(--ease-out);\n  --dy:18px; --pop:.94; /* entrance travel and start scale; flattened under reduced motion */\n}\n* { box-sizing:border-box }\nhtml { scroll-behavior:smooth; scroll-padding-top:110px }\nbody { margin:0; background:#FFFFFF; color:var(--ink); font:17px/1.55 var(--body); -webkit-font-smoothing:antialiased; overflow-x:clip }\na { color:inherit; text-decoration:none }\nbutton { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0 }\na:focus-visible, button:focus-visible { outline:3px solid var(--mint); outline-offset:3px; border-radius:12px }\n.wrap { max-width:1240px; margin:0 auto; padding-inline:24px }\n.num { font-variant-numeric:tabular-nums }\n\n/* Nav: one centered pill (logo badge + links), nothing on the sides. Sits at the top of the page and scrolls away with it; it does not follow you down */\n.nav { position:absolute; inset:0 0 auto 0; z-index:50; padding:calc(16px + env(safe-area-inset-top,0px)) 12px 0; display:flex; justify-content:center; pointer-events:none }\n.nav-in { pointer-events:auto; display:flex; align-items:center; gap:10px; padding:6px; background:#fff; border-radius:999px; border:1px solid rgba(1,92,85,.1); box-shadow:0 4px 0 rgba(1,47,43,.22), 0 14px 30px rgba(0,25,22,.18); animation:navIn .75s .1s cubic-bezier(.34,1.45,.64,1) both }\n/* The pill drops in with a small overshoot, the badge spins into place, then the links get a hover pill that glides between them */\n@keyframes navIn { from { opacity:0; transform:translateY(calc(var(--dy) * -1.4)) scale(.92) } }\n@keyframes badgeIn { from { rotate:-220deg; scale:.55 } }\n.logo .badge { animation:badgeIn .9s .25s var(--ease-out) backwards }\n.logo { display:flex; align-items:center; gap:12px; color:var(--teal); font:700 20px/1 var(--display); letter-spacing:-.025em; white-space:nowrap; padding-right:10px }\n/* Trivela curl: .kick carries the badge sideways (fast ease-out) while .badge lifts and spins on a slower curve, so the path bends like a swerving shot */\n.logo .kick { display:block; flex:none; transition:translate .32s var(--ease-out) }\n.logo .badge { width:50px; height:50px; border-radius:50%; overflow:hidden; background:var(--teal); display:block; transition:translate .32s var(--ease-in-out), rotate .32s var(--ease-out), scale .32s var(--ease-out) }\n.logo img { width:100%; height:100%; display:block; transform:scale(1.32) }\n.nav-links { position:relative; display:flex; align-items:center; gap:6px; font:600 16px/1 var(--display); letter-spacing:-.01em }\n.nav-links a { position:relative; z-index:1; color:var(--ink); padding:12px 12px; transition:color .2s, transform .12s var(--ease) }\n/* Hover pill: one mint shape that glides from link to link (placed by script, desktop pointers only) */\n.nav-hl { position:absolute; left:0; top:0; z-index:0; border-radius:999px; background:var(--mint-soft); opacity:0; pointer-events:none; transition:transform .38s var(--ease-out), width .38s var(--ease-out), height .38s var(--ease-out), opacity .2s }\n.nav-hl.fresh { transition:opacity .2s }\n.nav-links a:active { transform:scale(.95) }\n/* Dashboard: the one filled button in the pill, so it reads as the way into the app */\n.nav-cta { display:inline-flex; align-items:center; height:44px; padding:0 20px; margin-left:4px; border-radius:999px; background:var(--teal); color:#fff; font:600 16px/1 var(--display); letter-spacing:-.01em; white-space:nowrap; transition:background-color .2s, transform .12s var(--ease) }\n.nav-cta:active { transform:scale(.95) }\n/* Buttons */\n.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; height:52px; padding:0 26px; border-radius:999px; font-weight:600; font-size:16px;\n  transition:transform .14s var(--ease), box-shadow .25s, background .25s, color .25s; white-space:nowrap; user-select:none }\n.btn:active { transform:scale(.97) }\n.btn-white { background:#fff; color:var(--teal); box-shadow:0 10px 30px rgba(0,30,27,.25) }\n.btn-teal { background:var(--teal); color:#fff }\n.btn-sm { height:42px; padding:0 20px; font-size:15px }\n/* Hero pair: glossy pills. A vertical gradient, two dark pools in the bottom corners and a soft glow rising from the bottom center (the ::before layer, which swells on hover), inside a thin rim. Teal for the demo, white for How it works */\n.btn-glass { position:relative; isolation:isolate; overflow:hidden; padding:0 30px; border:1px solid var(--rim); font:600 17px/1 var(--display); letter-spacing:-.01em;\n  background:radial-gradient(ellipse 26% 62% at 20% 104%, var(--blob), transparent 72%), radial-gradient(ellipse 26% 62% at 80% 104%, var(--blob), transparent 72%), linear-gradient(180deg, var(--top), var(--bot));\n  box-shadow:var(--drop), inset 0 1px 0 var(--hi) }\n.btn-glass::before { content:\"\"; position:absolute; z-index:-1; left:50%; bottom:-70%; width:62%; height:130%; translate:-50% 0; border-radius:50%; background:radial-gradient(closest-side, var(--glow), transparent); opacity:.85; transition:opacity .35s, scale .35s var(--ease-out) }\n.btn-teal-glass { --top:#0B8478; --bot:#015C55; --blob:rgba(1,47,43,.85); --glow:rgba(120,235,215,.8); --rim:rgba(143,232,218,.55); --hi:rgba(255,255,255,.28); --drop:0 12px 30px rgba(0,25,22,.4); color:#fff }\n.btn-white-glass { --top:#FFFFFF; --bot:#DDF3EE; --blob:rgba(11,132,120,.28); --glow:rgba(11,132,120,.55); --rim:rgba(255,255,255,.95); --hi:#fff; --drop:0 12px 30px rgba(0,25,22,.3); color:var(--teal) }\n.hero .btn-glass { height:52px }\n.arrow { transition:transform .25s var(--ease) }\n/* Hover only where a real pointer exists; touch fires false hovers on tap */\n@media (hover:hover) and (pointer:fine) {\n  .logo:hover .kick { translate:6px 0 }\n  .logo:hover .badge { translate:0 -5px; rotate:18deg; scale:1.05 }\n  .nav-links a:hover { color:var(--teal) }\n  .nav-cta:hover { background:var(--teal-700) }\n  .btn-white:hover { box-shadow:0 14px 38px rgba(0,30,27,.35) }\n  .btn-glass:hover::before { opacity:1; scale:1.2 1.1 }\n  .btn-glass:hover { box-shadow:0 16px 38px rgba(0,25,22,.46), inset 0 1px 0 var(--hi) }\n  .btn-teal:hover { background:var(--teal-700) }\n  .btn:hover .arrow { transform:translateX(4px) }\n  .step:hover { transform:translateY(-6px); box-shadow:0 30px 60px rgba(1,92,85,.14) }\n  .group:hover { background:var(--paper); transform:translateY(-4px); border-color:transparent }\n}\n\n/* Hero */\n.hero { position:relative; z-index:3; color:#fff; min-height:100vh; min-height:100svh; display:flex; flex-direction:column }\n.hero-bg { position:absolute; inset:0; background:var(--teal) }\n.hero-in { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-top:calc(84px + env(safe-area-inset-top,0px) + clamp(8px,3vh,36px)); padding-bottom:clamp(20px,4vh,40px) }\n.hero-copy { max-width:1200px }\nh1 { margin:0; font:700 clamp(2.4rem,min(6.8vw,8.6vh),5.4rem)/1.02 var(--display); letter-spacing:-.035em; text-wrap:balance }\nh1 .pos { position:relative; display:inline-block; color:var(--mint) }\n/* \"differently.\" crossfades through 14 typefaces once, then lands on the brand face.\n   .sz is an invisible copy of the landing word and is the only thing that takes layout space, so \"See the game\" can never move.\n   The animated word floats over it (.pfw); JS matches every face's x-height to the brand face (font-size-adjust),\n   shrinks any face that would still overhang the slot, and pins each one to the slot's baseline. */\n.sz { color:transparent }\n.pfw { position:absolute; left:0; top:0; white-space:nowrap }\n.pf { position:relative; line-height:0 }\nh1 .pos svg { position:absolute; left:-2%; bottom:-.2em; width:104%; height:.34em; overflow:visible }\nh1 .pos path { stroke-dasharray:300; stroke-dashoffset:0; animation:draw 1.1s .6s var(--ease) both }\n@keyframes draw { from { stroke-dashoffset:300 } }\n.lede { margin:clamp(10px,1.8vh,18px) auto 0; max-width:44em; font-size:clamp(1.05rem,min(2.1vw,2.8vh),1.55rem); font-weight:500; line-height:1.35; letter-spacing:-.01em; color:#fff; text-wrap:balance }\n.cta-row { display:flex; gap:14px; flex-wrap:wrap; margin-top:36px }\n.hero .cta-row { justify-content:center; margin-top:clamp(18px,3.4vh,32px) }\n.hero .btn { height:48px }\n/* Headline lands word by word (60ms stagger), then the lede and buttons follow */\n.w { display:inline-block; animation:rise .7s calc(.15s + var(--i,0) * 60ms) var(--ease-out) both }\n.hero-copy > :not(h1) { animation:rise .7s var(--ease-out) both }\n.hero-copy > :nth-child(2) { animation-delay:.42s } .hero-copy > :nth-child(3) { animation-delay:.5s }\n@keyframes rise { from { opacity:0; transform:translateY(var(--dy)) } }\n\n.vis { position:relative; width:min(1080px,100%,max(340px,calc((100vh - 385px) * 1.544)),max(340px,calc((100svh - 385px) * 1.544))); margin-top:clamp(28px,5vh,48px); transform-style:preserve-3d; transform:perspective(1600px) rotateX(var(--rx,6deg)) rotateY(var(--ry,0deg)) scale(var(--sc,.97)); transition:transform .25s ease-out; animation:rise .8s .3s var(--ease-out) both }\n.vis-card { border-radius:28px; overflow:hidden; box-shadow:0 30px 70px rgba(0,25,22,.28) }\n.vis canvas { display:block; width:100%; height:auto; aspect-ratio:105/68 }\n/* Chips pop in after the card has settled (opacity on .vis flattens its 3D until then) */\n.chip { position:absolute; background:#fff; color:var(--ink); border-radius:18px; padding:13px 17px; box-shadow:0 22px 46px rgba(0,25,22,.34); transform:translateZ(60px); min-width:132px; animation:chipIn .5s calc(1.1s + var(--i,0) * 90ms) var(--ease-out) both }\n@keyframes chipIn { from { opacity:0; transform:translateZ(60px) translateY(var(--dy)) scale(var(--pop)) } }\n.chip small { display:block; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2) }\n.chip b { display:block; font:700 28px/1.1 var(--display); letter-spacing:-.025em; color:var(--teal); margin-top:3px }\n.chip .meter { height:5px; border-radius:5px; background:var(--mint-soft); margin-top:8px; overflow:hidden }\n.chip .meter i { display:block; height:100%; background:var(--teal); border-radius:5px; transition:width .6s var(--ease) }\n.chip.c1 { left:-34px; top:11%; --i:0 }\n.chip.c2 { right:-26px; top:-24px; --i:1 }\n.chip.c3 { right:7%; bottom:-18px; --i:2 }\n/* Wide screens have empty margins: park the chips beside the pitch instead of on top of its edges */\n@media (min-width:1560px) {\n  .chip.c1 { left:auto; right:calc(100% + 28px); top:30% }\n  .chip.c2 { right:auto; left:calc(100% + 28px); top:10% }\n  .chip.c3 { right:auto; left:calc(100% + 28px); bottom:12% }\n}\n\n/* White sheet */\n.sheet { position:relative; z-index:2; background:#fff; padding-block:112px 40px }\n.sheet > .wrap { position:relative }\n.kicker { font-size:13px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--teal-500) }\nh2 { margin:14px 0 0; font:800 clamp(2.3rem,4.8vw,4rem)/1 var(--display); letter-spacing:-.035em; text-wrap:balance }\n.sec-head { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:48px; align-items:end; margin-bottom:56px }\n.sec-head p { margin:0; color:var(--ink-2); font-size:18px }\n.steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px }\n.step { background:var(--paper); border-radius:30px; padding:14px 14px 30px; display:flex; flex-direction:column; gap:22px; transition:transform .25s var(--ease-out), box-shadow .25s var(--ease-out) }\n.step svg { display:block; width:100%; height:auto; border-radius:22px }\n.step svg text { font-variant-numeric:tabular-nums }\n.step.in .zone { animation:march 1.4s linear infinite }\n@keyframes march { to { stroke-dashoffset:-14 } }\n.step .txt { padding-inline:14px }\n.step .tag { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--teal); letter-spacing:.04em }\n.step .tag i { width:26px; height:26px; border-radius:50%; background:var(--teal); color:#fff; display:grid; place-items:center; font-style:normal; font-size:13px }\n.step h3 { margin:14px 0 8px; font:700 26px/1.1 var(--display); letter-spacing:-.025em }\n.step p { margin:0; color:var(--ink-2) }\n\n/* Football cities: dotted map of Europe on a teal card; routes draw city to city in turn, then wipe and replay */\n.cities { position:relative; z-index:2; background:#fff; padding-block:112px 8px }\n/* Width is capped by screen height (map is 105:77, padding up to 22px a side) so the whole card fits on one screen */\n.map-card { width:min(100%, max(520px, calc((100vh - 84px) * 1.9444 + 44px))); width:min(100%, max(520px, calc((100svh - 84px) * 1.9444 + 44px))); margin-inline:auto; background:var(--teal); border-radius:32px; padding:clamp(10px,2vw,22px); box-shadow:0 40px 80px rgba(1,47,43,.2); overflow:hidden }\n/* Big screens: the card may grow a little past the page column (cap 1320px), still centered and still limited by screen height */\n@media (min-width:1300px) { .map-card { position:relative; left:50%; translate:-50% 0; margin-inline:0; width:min(1320px, calc(100vw - 80px), max(520px, calc((100vh - 84px) * 1.9444 + 44px))); width:min(1320px, calc(100vw - 80px), max(520px, calc((100svh - 84px) * 1.9444 + 44px))) } }\n.map { position:relative; aspect-ratio:105/54; container-type:inline-size }\n.map svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n#mapDots { -webkit-mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent); mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent) }\n.route { fill:none; stroke:url(#routeGrad); stroke-width:.17; stroke-linecap:round; stroke-dasharray:1 1; stroke-dashoffset:1; transition:stroke-width .25s var(--ease-out) }\n.route.hot { stroke-width:.32 }\n.comet { fill:#fff; opacity:0 }\n.pin { cursor:pointer }\n.pin .core, .pin .ring { fill:#fff; transform-box:fill-box; transform-origin:center }\n.pin .core { transition:transform .35s cubic-bezier(.34,1.56,.64,1) }\n.pin .ring { opacity:0; animation:ring 2s var(--d,0s) ease-out infinite }\n.pin .hit { fill:transparent }\n.pin.on .core { transform:scale(1.5) }\n@keyframes ring { from { opacity:.6; transform:scale(1) } to { opacity:0; transform:scale(4) } }\n.map-labels { position:absolute; inset:0; pointer-events:none }\n/* Labels scale with the map (container width), so neighbours never collide at mid widths. The map is 1.94:1, wide and short, so it fills a widescreen */\n.map-label { position:absolute; left:calc(var(--x) * 1%); top:calc(var(--y) * 1%); padding:.46em .85em; border-radius:999px; background:#fff; color:var(--teal); font:600 clamp(10px,.9cqw,13px)/1 var(--body); white-space:nowrap; box-shadow:0 8px 18px rgba(0,25,22,.28);\n  opacity:0; transform:translateY(calc(var(--dy) * .4)); transition:opacity .45s calc(.35s + var(--i) * 55ms) var(--ease-out), transform .45s calc(.35s + var(--i) * 55ms) var(--ease-out), background-color .2s, color .2s }\n.map-label.t { translate:-50% calc(-100% - 1em) } .map-label.b { translate:-50% 1em }\n.map-label.l { translate:calc(-100% - 1em) -50% } .map-label.r { translate:1em -50% }\n.map-card.in .map-label { opacity:1; transform:none }\n.map-card.in .map-label.on { background:var(--teal-900); color:#fff; transition-delay:0s }\n/* Mid-size screens: only the big-name cities keep a label, so nothing overlaps; every city still has its pin */\n@container (max-width:1100px) { .map-label.minor { display:none } }\n.map-tip { position:absolute; left:10px; bottom:10px; display:none; padding:8px 12px; border-radius:12px; background:#fff; color:var(--teal); font-size:14px; font-weight:600; box-shadow:0 8px 18px rgba(0,25,22,.28) }\n\n/* Vision model: one big glass \"app window\" showing a real model frame. Four capabilities below it drive what the window highlights.\n   The window eases up to full size as it scrolls in and leans gently toward the pointer (smoothed every frame, so it can be redirected mid-motion). */\n.vision { position:relative; overflow:hidden; color:#fff; padding-block:128px 120px; background:var(--teal) }\n.vision .kicker { color:var(--mint) }\n.vhead { text-align:center; max-width:840px; margin:0 auto }\n.vhead h2 { font-size:clamp(2.4rem,5.4vw,4.6rem); line-height:1.02; letter-spacing:-.045em }\n/* \"Advanced\" glitches hard in bursts: the word itself stutters and skews with a mint/dark split, and mint and dark-teal slice copies tear across it, then it rests clean.\n   First burst lands just after the heading rises in, then every 2.6s (~470ms each). Copies are absolutely positioned, so the word keeps its normal space; the alt-text content keeps them out of the accessible name. */\n.glitch { position:relative; display:inline-block }\n.glitch::before, .glitch::after { content:attr(data-text); content:attr(data-text) / \"\"; position:absolute; left:0; top:0; white-space:nowrap; pointer-events:none; opacity:0 }\n.glitch::before { color:var(--mint); text-shadow:0 0 .35em rgba(143,232,218,.8) }\n.glitch::after { color:var(--teal-900) }\n.vhead.in .glitch { animation:glitchW 2.6s .5s steps(1,end) infinite }\n.vhead.in .glitch::before { animation:glitchA 2.6s .5s steps(1,end) fill=\"none\" stroke=\"#fff\" stroke-opacity=\".38\" stroke-width=\".35\">\n                <rect x=\"1\" y=\"1\" width=\"103\" height=\"66\" rx=\"1\"/><line x1=\"52.5\" y1=\"1\" x2=\"52.5\" y2=\"67\"/><circle cx=\"52.5\" cy=\"34\" r=\"9.15\"/>\n                <rect x=\"1\" y=\"13.85\" width=\"16.5\" height=\"40.3\"/><rect x=\"87.5\" y=\"13.85\" width=\"16.5\" height=\"40.3\"/>\n                <rect x=\"1\" y=\"24.84\" width=\"5.5\" height=\"18.32\"/><rect x=\"98.5\" y=\"24.84\" width=\"5.5\" height=\"18.32\"/>\n                <path d=\"M17.5 26.7A9.15 9.15 0 0 1 17.5 41.3M87.5 26.7A9.15 9.15 0 0 0 87.5 41.3\"/>\n              <\/g>\n              <g fill=\"#fff\" fill-opacity=\".45\"><circle cx=\"52.5\" cy=\"34\" r=\".5\"/><circle cx=\"12\" cy=\"34\" r=\".4\"/><circle cx=\"93\" cy=\"34\" r=\".4\"/><\/g>\n              <g id=\"repOver\"><\/g>\n            <\/svg>\n          <\/div>\n          <div class=\"rep-legend\" id=\"repLegend\" aria-live=\"polite\"><\/div>\n        <\/div>\n        <div class=\"rep-side\">\n          <div class=\"rep-card\">\n            <h3>Team comparison<\/h3>\n            <ul class=\"cmp\">\n              <li><b>56%<\/b><span>Possession<\/span><b>44%<\/b><div class=\"bar\" aria-hidden=\"true\"><i style=\"--f:56\"><\/i><i style=\"--f:44\"><\/i><\/div><\/li>\n              <li><b>498<\/b><span>Passes<\/span><b>391<\/b><div class=\"bar\" aria-hidden=\"true\"><i style=\"--f:498\"><\/i><i style=\"--f:391\"><\/i><\/div><\/li>\n              <li><b>87%<\/b><span>Pass accuracy<\/span><b>81%<\/b><div class=\"bar\" aria-hidden=\"true\"><i style=\"--f:87\"><\/i><i style=\"--f:81\"><\/i><\/div><\/li>\n              <li><b>14<\/b><span>Shots<\/span><b>9<\/b><div class=\"bar\" aria-hidden=\"true\"><i style=\"--f:14\"><\/i><i style=\"--f:9\"><\/i><\/div><\/li>\n              <li><b>6<\/b><span>Shots on target<\/span><b>3<\/b><div class=\"bar\" aria-hidden=\"true\"><i style=\"--f:6\"><\/i><i style=\"--f:3\"><\/i><\/div><\/li>\n              <li><b>112.4 km<\/b><span>Distance<\/span><b>109.8 km<\/b><div class=\"bar\" aria-hidden=\"true\"><i style=\"--f:112.4\"><\/i><i style=\"--f:109.8\"><\/i><\/div><\/li>\n            <\/ul>\n          <\/div>\n          <div class=\"rep-card\">\n            <h3>Key moments<\/h3>\n            <div class=\"moms\">\n              <button class=\"mom\" data-goal=\"0\" aria-pressed=\"false\"><span class=\"t\">23'<\/span><span class=\"ico\" style=\"--c:var(--home)\" aria-hidden=\"true\">G<\/span><span><b>Goal<\/b> <small>#9 · Harbor City<\/small><\/span><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button>\n              <button class=\"mom\" data-goal=\"1\" aria-pressed=\"false\"><span class=\"t\">51'<\/span><span class=\"ico\" style=\"--c:var(--away)\" aria-hidden=\"true\">G<\/span><span><b>Goal<\/b> <small>#10 · Northgate United<\/small><\/span><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button>\n              <button class=\"mom\" data-goal=\"2\" aria-pressed=\"false\"><span class=\"t\">78'<\/span><span class=\"ico\" style=\"--c:var(--home)\" aria-hidden=\"true\">G<\/span><span><b>Goal<\/b> <small>#7 · Harbor City<\/small><\/span><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"rep-foot\">\n        <p>Your matches get the same report, with all 20 stats.<\/p>\n        <div><a class=\"textlink\" href=\"app.html#report\">Open the full report <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/a><a class=\"btn btn-teal btn-sm\" href=\"app.html#upload\">Analyze your match<\/a><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"cta\">\n  <div class=\"wrap\">\n    <div class=\"cta-card\" data-reveal>\n      <div class=\"eye\" aria-hidden=\"true\"><svg viewBox=\"0 0 340 220\" fill=\"none\">\n        <defs>\n          <clipPath id=\"eyeClip\"><path d=\"M12 110 Q170 -14 328 110 Q170 234 12 110Z\"/><\/clipPath>\n          <radialGradient id=\"irisG\" cx=\"50%\" cy=\"50%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#012F2B\"/><stop offset=\".42\" stop-color=\"#0B8478\"/><stop offset=\"1\" stop-color=\"#8FE8DA\"/><\/radialGradient>\n          <linearGradient id=\"beamG\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#8FE8DA\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#8FE8DA\" stop-opacity=\".55\"/><\/linearGradient>\n        <\/defs>\n        <path d=\"M12 110 Q170 -14 328 110 Q170 234 12 110Z\" fill=\"rgba(255,255,255,.07)\"/>\n        <g clip-path=\"url(#eyeClip)\">\n          <g class=\"eye-iris\">\n            <circle cx=\"170\" cy=\"110\" r=\"54\" fill=\"url(#irisG)\"/>\n            <circle cx=\"170\" cy=\"110\" r=\"54\" stroke=\"#8FE8DA\" stroke-opacity=\".7\" stroke-width=\"2\"/>\n            <circle cx=\"170\" cy=\"110\" r=\"22\" fill=\"#012F2B\"/>\n            <circle cx=\"158\" cy=\"98\" r=\"7\" fill=\"#fff\" fill-opacity=\".9\"/>\n          <\/g>\n          <g class=\"eye-beam\"><rect x=\"-70\" y=\"0\" width=\"70\" height=\"220\" fill=\"url(#beamG)\"/><rect x=\"-2\" y=\"0\" width=\"3\" height=\"220\" fill=\"#8FE8DA\"/><\/g>\n        <\/g>\n        <path d=\"M12 110 Q170 -14 328 110 Q170 234 12 110Z\" stroke=\"#8FE8DA\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n        <g class=\"eye-brackets\" stroke=\"#8FE8DA\" stroke-width=\"3\" stroke-linecap=\"round\">\n          <path d=\"M96 34V16H114\"/><path d=\"M226 16H244V34\"/><path d=\"M244 186V204H226\"/><path d=\"M114 204H96V186\"/>\n        <\/g>\n      <\/svg><\/div>\n      <h2>Bring your first match.<\/h2>\n      <p>Upload a video and get the report you just tried, for your own team.<\/p>\n      <div class=\"cta-row\" style=\"margin-top:34px\"><a class=\"btn btn-white\" href=\"app.html#upload\">Analyze a match <svg class=\"arrow\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/a><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n\n\n<script>\n(() => {\nconst reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst $ = s => document.querySelector(s);\n\nconst hero = $('#top');\n\n/* ---------- Nav: a hover pill that glides between links ---------- */\n{\n  const links = $('.nav-links');\n  if (links && matchMedia('(hover:hover) and (pointer:fine)').matches) {\n    const hl = document.createElement('span'); hl.className = 'nav-hl fresh'; hl.setAttribute('aria-hidden', 'true'); links.appendChild(hl);\n    const to = a => {\n      const was = hl.style.opacity === '1';\n      hl.classList.toggle('fresh', !was); /* first entry appears in place; later moves slide */\n      hl.style.width = a.offsetWidth + 'px'; hl.style.height = a.offsetHeight + 'px';\n      hl.style.transform = 'translate(' + a.offsetLeft + 'px,' + a.offsetTop + 'px)'; hl.style.opacity = '1';\n    };\n    links.querySelectorAll('a').forEach(a => { a.addEventListener('pointerenter', () => to(a)); a.addEventListener('focus', () => { if (a.matches(':focus-visible')) to(a); }); a.addEventListener('blur', () => hl.style.opacity = '0'); });\n    links.addEventListener('pointerleave', () => hl.style.opacity = '0');\n  }\n}\n\n/* ---------- Scroll reveals: each block rises in once; the big 20 counts up ---------- */\nconst EASE_OUT = 'cubic-bezier(.23,1,.32,1)';\nconst big = $('#big20'), bigNum = $('#big20 .n');\nconst countUp = () => {\n  const t0 = performance.now(), DUR = 1000;\n  const tick = now => {\n    const p = Math.min(1, (now - t0) / DUR);\n    bigNum.textContent = String(Math.round(20 * (1 - Math.pow(1 - p, 4)))).padStart(2, '0'); /* two digits all the way, so the number never changes width */\n    if (p < 1) requestAnimationFrame(tick);\n  };\n  requestAnimationFrame(tick);\n};\nconst revealEls = document.querySelectorAll('[data-reveal]');\nif ('IntersectionObserver' in window) {\n  if (!reduced) bigNum.textContent = '00';\n  const io = new IntersectionObserver(entries => entries.forEach(e => {\n    if (!e.isIntersecting) return;\n    e.target.classList.add('in'); io.unobserve(e.target);\n    if (e.target === big && !reduced) countUp();\n  }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });\n  revealEls.forEach(el => io.observe(el));\n} else revealEls.forEach(el => el.classList.add('in'));\n\n/* ---------- Headline word: crossfades through 14 typefaces, then lands on the brand face and stops ---------- */\nconst pf = $('.pf'), pfw = pf.parentElement, slot = $('.sz');\nconst FINAL = { f: '\"Bricolage Grotesque\"', w: 700, s: 'normal', c: '#8FE8DA' };\nconst FACES = [\n  { f: '\"Instrument Serif\"', w: 400, s: 'italic', c: '#B9F3E8' },\n  { f: '\"Bagel Fat One\"', w: 400, s: 'normal', c: '#74DCCB' },\n  { f: '\"Playfair Display\"', w: 900, s: 'italic', c: '#A5EFE2' },\n  { f: '\"VT323\"', w: 400, s: 'normal', c: '#8FE8DA' },\n  { f: '\"Pacifico\"', w: 400, s: 'normal', c: '#C4F6EC' },\n  { f: '\"Archivo Black\"', w: 400, s: 'normal', c: '#74DCCB' },\n  { f: '\"Fraunces\"', w: 900, s: 'italic', c: '#B9F3E8' },\n  { f: '\"Chakra Petch\"', w: 700, s: 'normal', c: '#A5EFE2' },\n  { f: '\"Lobster\"', w: 400, s: 'normal', c: '#8FE8DA' },\n  { f: '\"Caprasimo\"', w: 400, s: 'normal', c: '#74DCCB' },\n  { f: '\"Permanent Marker\"', w: 400, s: 'normal', c: '#C4F6EC' },\n  { f: '\"Gloock\"', w: 400, s: 'normal', c: '#A5EFE2' },\n  { f: '\"Righteous\"', w: 400, s: 'normal', c: '#B9F3E8' },\n  { f: '\"Shrikhand\"', w: 400, s: 'normal', c: '#74DCCB' },\n];\nconst HOLD_MS = 300;\nconst setFace = f => Object.assign(pf.style, { fontFamily: f.f + ',var(--display)', fontWeight: f.w, fontStyle: f.s, fontSize: (f.k || 1) + 'em', top: (f.dy || 0) + 'em', color: f.c });\n/* zero-size marker: its left edge measures ex, its bottom edge sits exactly on the baseline */\nconst marker = (el, css) => { const m = document.createElement('span'); m.style.cssText = 'display:inline-block;height:0;' + css; return el.appendChild(m); };\nif (!reduced && document.fonts) {\n  Promise.all([FINAL, ...FACES].map(f => document.fonts.load(`${f.s} ${f.w} 1em ${f.f}`, 'differently.'))).then(async () => {\n    const ex = marker(slot, 'width:1ex');\n    pfw.style.fontSizeAdjust = 'ex-height ' + (ex.getBoundingClientRect().width / parseFloat(getComputedStyle(slot).fontSize)).toFixed(4);\n    ex.remove();\n    const target = slot.getBoundingClientRect().width;\n    const slotBase = marker(slot, 'width:0'), wordBase = marker(pf, 'width:0');\n    [...FACES, FINAL].forEach(f => {\n      f.k = 1; f.dy = 0; setFace(f);\n      f.k = Math.min(1, target / pf.getBoundingClientRect().width); setFace(f);\n      f.dy = (slotBase.getBoundingClientRect().bottom - wordBase.getBoundingClientRect().bottom) / parseFloat(getComputedStyle(pf).fontSize);\n    });\n    slotBase.remove(); wordBase.remove();\n    setFace(FINAL);\n    const wait = ms => new Promise(r => setTimeout(r, ms));\n    const OUT = [{ opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(3px)' }];\n    const IN = [{ opacity: 0, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0px)' }];\n    /* fade the old face out, swap while invisible, fade the new one in; the landing fade is slower so it settles */\n    const show = async (f, landing) => {\n      const out = pfw.animate(OUT, { duration: 140, easing: EASE_OUT, fill: 'forwards' });\n      await out.finished;\n      setFace(f);\n      pfw rivela Labs Dashboard<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600;700&display=swap\">\n<style>\n/* Layout: the landing's teal world. A teal header holds the nav pill, the greeting and a live CV window; a paper sheet slides over it with past analyses, saved players, then saved teams beside recent activity. Light only, like the landing. */\n:root {\n  --teal:#015C55; --teal-700:#014B45; --teal-900:#012F2B; --teal-500:#0B8478;\n  --mint:#8FE8DA; --mint-soft:#D3F5EF; --paper:#F2F8F7; --pitch:#E6F2F0; --white:#FFFFFF;\n  --ink:#06201D; --ink-2:#4A6663; --line:rgba(1,92,85,.14); --ball:#FFD60A;\n  --display:\"Bricolage Grotesque\",\"Avenir Next\",\"Segoe UI\",system-ui,sans-serif;\n  --body:\"DM Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1); --ease:var(--ease-out);\n  --dy:16px; --pop:.96; /* entrance travel and start scale; flattened under reduced motion */\n  color-scheme:light;\n}\n* { box-sizing:border-box }\nhtml { scroll-behavior:smooth; scroll-padding-top:24px; background:var(--paper) }\nbody { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 var(--body); -webkit-font-smoothing:antialiased; overflow-x:clip }\na { color:inherit; text-decoration:none }\nbutton, input { font:inherit; color:inherit }\nbutton { background:none; border:0; cursor:pointer; padding:0 }\n:focus-visible { outline:3px solid var(--teal-500); outline-offset:3px; border-radius:12px }\n.top :focus-visible { outline-color:var(--mint) }\n.wrap { max-width:1240px; margin:0 auto; padding-inline:24px }\n.num { font-variant-numeric:tabular-nums }\n@keyframes rise { from { opacity:0; transform:translateY(var(--dy)) } }\n.rise { animation:rise .7s calc(.1s + var(--i,0) * 80ms) var(--ease-out) both }\n@keyframes settle { from { opacity:0; transform:scale(var(--pop)) } }\n\n/* Nav: the landing's centered pill. Home is a quiet link like the rest; the one filled button is the main action, New analysis */\n.nav { position:absolute; inset:0 0 auto 0; z-index:50; padding:calc(16px + env(safe-area-inset-top,0px)) 12px 0; display:flex; justify-content:center; pointer-events:none }\n.nav-in { pointer-events:auto; display:flex; align-items:center; gap:10px; padding:6px; background:#fff; border-radius:999px; border:1px solid rgba(1,92,85,.1); box-shadow:0 4px 0 rgba(1,47,43,.22), 0 14px 30px rgba(0,25,22,.18); animation:navIn .75s .1s cubic-bezier(.34,1.45,.64,1) both }\n@keyframes navIn { from { opacity:0; transform:translateY(calc(var(--dy) * -1.4)) scale(.92) } }\n.logo { display:flex; align-items:center; gap:12px; color:var(--teal); font:700 20px/1 var(--display); letter-spacing:-.025em; white-space:nowrap; padding-right:10px }\n.logo .kick { display:block; flex:none; transition:translate .32s var(--ease-out) }\n.logo .badge { width:50px; height:50px; border-radius:50%; overflow:hidden; background:var(--teal); display:block; transition:translate .32s cubic-bezier(.77,0,.175,1), rotate .32s var(--ease-out), scale .32s var(--ease-out) }\n.logo img { width:100%; height:100%; display:block; transform:scale(1.32) }\n.nav-links { position:relative; display:flex; align-items:center; gap:6px; font:600 16px/1 var(--display); letter-spacing:-.01em }\n.nav-links a { position:relative; z-index:1; color:var(--ink); padding:12px; transition:color .2s }\n.nav-hl { position:absolute; left:0; top:0; z-index:0; border-radius:999px; background:var(--mint-soft); opacity:0; pointer-events:none; transition:transform .38s var(--ease-out), width .38s var(--ease-out), height .38s var(--ease-out), opacity .2s }\n.nav-hl.fresh { transition:opacity .2s }\n.nav-cta { display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 18px; margin-left:4px; border-radius:999px; background:var(--teal); color:#fff; font:600 16px/1 var(--display); letter-spacing:-.01em; white-space:nowrap; transition:background-color .2s, transform .12s var(--ease) }\n.nav-cta:active, .btn:active { transform:scale(.97) }\n\n/* Buttons */\n.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; height:48px; padding:0 24px; border-radius:999px; font-weight:600; font-size:16px; white-space:nowrap; user-select:none;\n  transition:transform .14s var(--ease), box-shadow .25s, background-color .25s, color .25s }\n.btn-teal { background:var(--teal); color:#fff }\n.btn-ghost { background:var(--paper); color:var(--teal) }\n.btn-sm { height:40px; padding:0 18px; font-size:15px }\n/* Quiet text link on teal (same as the landing's \"See how it works\") */\n.btn-text { display:inline-flex; align-items:center; gap:4px; height:44px; color:var(--mint); font:600 17px/1 var(--display); letter-spacing:-.01em; transition:color .2s, transform .12s var(--ease) }\n.btn-text:active { transform:scale(.97) }\n.btn-text .chev { transition:transform .25s var(--ease) }\n.arrow { transition:transform .25s var(--ease) }\n@media (hover:hover) and (pointer:fine) {\n  .logo:hover .kick { translate:6px 0 }\n  .logo:hover .badge { translate:0 -5px; rotate:18deg; scale:1.05 }\n  .nav-links a:hover { color:var(--teal) }\n  .nav-cta:hover, .btn-teal:hover { background:var(--teal-700) }\n  .btn-text:hover { color:#fff } .btn-text:hover .chev { transform:translateX(3px) }\n  .latest:hover { background:rgba(1,47,43,.72) }\n  .btn-ghost:hover { background:var(--mint-soft) }\n  .btn:hover .arrow, .row:hover .arrow, .from:hover .arrow, .latest:hover .arrow { transform:translateX(4px) }\n  .row:hover { background:var(--paper) }\n  .pcard:hover { transform:translateY(-4px); box-shadow:0 2px 4px rgba(1,47,43,.05), 0 30px 56px rgba(1,47,43,.12) }\n  .save:hover { background:var(--mint-soft) }\n}\n/* On a player card the bookmark floats in the corner, so the name can use the full row and every card's header is the same height */\n.pcard .save { position:absolute; top:14px; right:14px }\n.pcard .who { margin-right:30px }\n\n/* Header: greeting and season numbers on the left; on the right, what needs you now: the analysis that is running and the latest result. One pitch center-circle arc in the corner, as on the landing */\n.top { position:relative; overflow:hidden; background:var(--teal); color:#fff; padding-block:calc(120px + env(safe-area-inset-top,0px)) 112px }\n.top::before { content:\"\"; position:absolute; width:760px; aspect-ratio:1; right:-260px; top:-220px; border-radius:50%; border:1.5px solid rgba(255,255,255,.08); pointer-events:none }\n.top-grid { position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.08fr); gap:56px; align-items:center }\nh1 { margin:0; font:700 clamp(2.6rem,5vw,4.3rem)/1 var(--display); letter-spacing:-.04em; text-wrap:balance }\nh1 em { font-style:normal; color:var(--mint) }\n.lede { margin:18px 0 0; max-width:31em; font-size:clamp(1.02rem,1.4vw,1.15rem); color:rgba(255,255,255,.82) }\n.top .btn-text { margin-top:18px; margin-left:-2px }\n.meta { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px; margin:28px 0 0; padding-top:22px; border-top:1px solid rgba(255,255,255,.18) }\n.meta div { display:flex; flex-direction:column-reverse; min-width:0 }\n.meta dd { margin:0; font:700 30px/1 var(--display); letter-spacing:-.02em }\n.meta dt { margin-top:6px; font-size:13.5px; color:rgba(255,255,255,.72) }\n\n/* Right column: the running analysis on top, the latest finished match under it. Both are dark glass cards on the teal */\n.now { display:grid; gap:16px }\n.chip.busy::before { content:\"\"; flex:none; width:8px; height:8px; border-radius:50%; background:var(--mint); animation:livePulse 2s ease-out infinite }\n@keyframes livePulse { from { box-shadow:0 0 0 0 rgba(143,232,218,.6) } to { box-shadow:0 0 0 9px rgba(143,232,218,0) } }\n@keyframes scan { 0% { opacity:0; transform:translateX(-100%) } 8% { opacity:1 } 62% { opacity:1; transform:translateX(0) } 72%, 100% { opacity:0; transform:translateX(0) } }\n.cv-run, .latest { display:grid; gap:14px; padding:24px 26px 26px; border-radius:26px; background:rgba(1,47,43,.5); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), 0 30px 70px rgba(0,20,18,.22) }\n.run-top { display:flex; justify-content:space-between; align-items:flex-end; gap:16px }\n.run-top > div { min-width:0 }\n.run-top small, .latest small { display:block; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--mint) }\n.run-top b { display:block; margin-top:6px; font:700 clamp(22px,2.2vw,28px)/1.15 var(--display); letter-spacing:-.025em }\n.run-top .run-pct { margin:0; font-size:clamp(40px,4vw,52px); line-height:1; letter-spacing:-.04em }\n/* Latest result: heatmap thumb beside the fixture, the three headline numbers under it, and a way into the report */\n.latest { grid-template-columns:132px minmax(0,1fr); grid-template-areas:\"thumb main\" \"stats stats\" \"go go\"; align-items:center; column-gap:20px; transition:background-color .2s }\n.latest .thumb { grid-area:thumb }\n.latest .thumb .pf { fill:rgba(255,255,255,.08) } .latest .thumb .hc { fill:var(--mint) } .latest .thumb .tl { stroke:rgba(255,255,255,.32) }\n.lt-main { grid-area:main; display:grid; gap:6px; min-width:0 }\n.latest .fixture { font-size:20px }\n.latest .score { background:var(--mint); color:var(--teal-900) }\n.lt-sub { font-size:14px; color:rgba(255,255,255,.72) }\n.lt-stats { grid-area:stats; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding-top:16px; border-top:1px solid rgba(255,255,255,.14) }\n.lt-stats small { color:rgba(255,255,255,.66) }\n.lt-stats b { display:block; margin-top:4px; font:700 24px/1 var(--display); letter-spacing:-.02em }\n.lt-go { grid-area:go; display:flex; align-items:center; gap:8px; font-weight:600; color:var(--mint) }\n.latest.arrive > * { animation:rise 400ms calc(var(--k,0) * 60ms) var(--ease-out) both }\n.run-bar { height:6px; border-radius:6px; background:rgba(255,255,255,.12); overflow:hidden }\n.run-bar i { display:block; height:100%; border-radius:6px; background:var(--mint); transform-origin:left; transition:transform .6s var(--ease-out) }\n.run-meta { display:flex; justify-content:space-between; gap:4px 12px; flex-wrap:wrap; margin:0; font-size:14px; color:rgba(255,255,255,.72) }\n.cv-run.arrive > * { animation:rise 400ms calc(var(--k,0) * 60ms) var(--ease-out) both } /* \"All caught up\" rises in after the progress card fades out */\n\n/* Sheet: paper slides over the teal header */\n.sheet { position:relative; z-index:2; margin-top:-40px; background:var(--paper); border-radius:40px 40px 0 0; padding-block:56px 112px }\n.block + .block { margin-top:72px }\n.panel { background:#fff; border-radius:28px; padding:28px; box-shadow:0 1px 2px rgba(1,47,43,.05), 0 20px 44px rgba(1,47,43,.07) }\n.sec-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px 24px; flex-wrap:wrap; margin-bottom:18px }\n.sec-head > div:first-child { min-width:0 }\nh2 { margin:0; display:flex; align-items:center; gap:12px; font:800 clamp(1.7rem,2.6vw,2.2rem)/1.05 var(--display); letter-spacing:-.035em; text-wrap:balance }\nh2:focus { outline:none }\n.count { padding:6px 10px; border-radius:999px; background:var(--mint-soft); color:var(--teal); font:600 14px/1 var(--body); letter-spacing:0 }\n.sec-head p { margin:6px 0 0; color:var(--ink-2) }\n.tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center }\n.seg { display:inline-flex; gap:2px; padding:4px; border-radius:999px; background:var(--paper) }\n.seg button { height:34px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:600; color:var(--ink-2); transition:background-color .2s, color .2s, box-shadow .2s }\n.seg button[aria-pressed=\"true\"] { background:#fff; color:var(--teal); box-shadow:0 1px 3px rgba(1,47,43,.16) }\n.seg .n { margin-left:6px; font-weight:500; color:var(--ink-2) }\n.search { position:relative; display:flex; align-items:center }\n.search svg { position:absolute; left:14px; color:var(--ink-2); pointer-events:none }\n.search input { width:220px; height:42px; padding:0 14px 0 38px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:15px }\n.search input:focus { border-color:var(--teal-500) }\n\n/* Past analyses: one row per match. Thumbnail heatmap, fixture, three headline stats, status */\n.rows { list-style:none; margin:0; padding:0 }\n.rows li + li { border-top:1px solid var(--line) }\n.row { display:grid; grid-template-columns:112px minmax(0,1fr) auto 132px 18px; grid-template-areas:\"thumb main stats chip go\"; align-items:center; gap:20px; margin-inline:-12px; padding:14px 12px; border-radius:18px; transition:background-color .2s }\n.thumb { grid-area:thumb; position:relative; display:block; overflow:hidden; border-radius:10px; aspect-ratio:105/68; max-width:100% }\n.thumb svg { display:block; width:100%; height:100% }\n.thumb .pf { fill:var(--pitch) } .thumb .hc { fill:var(--teal) }\n.thumb .tl { fill:none; stroke:rgba(1,92,85,.3); stroke-width:.7 }\n.thumb.busy::after { content:\"\"; position:absolute; inset:0; background:linear-gradient(90deg, rgba(143,232,218,0) 60%, rgba(143,232,218,.5)); border-right:2px solid var(--teal-500); animation:scan 3s cubic-bezier(.77,0,.175,1) infinite }\n.row-main { grid-area:main; display:grid; gap:4px; min-width:0 }\n.fixture { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; font:700 18px/1.25 var(--display); letter-spacing:-.02em }\n.score { padding:3px 9px; border-radius:8px; background:var(--teal-900); color:#fff; font-size:15px; letter-spacing:0 }\n.vs { font:500 15px var(--body); color:var(--ink-2) }\n.row-sub { font-size:14px; color:var(--ink-2) }\n.row-stats { grid-area:stats; display:grid; grid-template-columns:repeat(3,84px); gap:8px }\n.row-stats small, .pstats dt, .tnums dt { display:block; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2) }\n.row-stats b { display:block; margin-top:3px; font:700 17px/1.1 var(--display); letter-spacing:-.01em }\n.row-stats .wait { grid-column:1 / -1; font-size:14px; color:var(--ink-2) }\n.chip { grid-area:chip; justify-self:start; display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 12px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap }\n.chip.ready { background:var(--mint-soft); color:var(--teal) }\n.chip.ready::before { content:\"\"; width:7px; height:7px; border-radius:50%; background:var(--teal) }\n.chip.busy { background:var(--teal-900); color:#fff }\n.go { grid-area:go; color:var(--teal); display:flex }\n.none { display:grid; justify-items:start; gap:12px; padding:28px 0 8px; color:var(--ink-2) }\n.none p { margin:0 }\n/* The analysis that just finished: its Ready chip and score settle in, then the three stats rise in turn. One-shot; the class only exists on the render right after completion */\n.just-ready .chip { animation:settle 260ms var(--ease-out) both }\n.just-ready .score { animation:settle 300ms 60ms var(--ease-out) both }\n.just-ready .row-stats > span { animation:rise 400ms calc(120ms + var(--k,0) * 50ms) var(--ease-out) both }\n\n/* Saved players: one card per player, numbers by shirt (the CV knows numbers, not names) */\n.pgrid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px }\n.pcard { position:relative; display:flex; flex-direction:column; gap:18px; min-width:0; padding:20px; border-radius:26px; background:#fff; box-shadow:0 1px 2px rgba(1,47,43,.05), 0 20px 44px rgba(1,47,43,.07); transition:transform .25s var(--ease-out), box-shadow .25s var(--ease-out) }\n.pcard header, .trow { display:flex; align-items:center; gap:12px }\n.shirt { flex:none; width:52px; height:52px; border-radius:16px; display:grid; place-items:center; font:800 24px/1 var(--display); letter-spacing:-.03em }\n.crest { flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font:800 14px/1 var(--display); letter-spacing:.01em }\n.t1 { background:var(--teal); color:#fff } .t2 { background:var(--teal-900); color:var(--mint) } .t3 { background:var(--teal-500); color:#fff }\n.t4 { background:#fff; color:var(--teal); box-shadow:inset 0 0 0 2px var(--teal) } .t5 { background:var(--mint-soft); color:var(--teal-900) }\n.who { flex:1; min-width:0 }\n.who b { display:block; font:700 17px/1.2 var(--display); letter-spacing:-.02em }\n.who span { font-size:14px; color:var(--ink-2) }\n.save { flex:none; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:var(--teal); transition:background-color .2s }\n.pstats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:0 }\n.pstats div { min-width:0 }\n.pstats dd, .tnums dd { margin:4px 0 0; font:700 19px/1.1 var(--display); letter-spacing:-.02em; white-space:nowrap }\n.pstats dd small { margin-left:3px; font:500 11px var(--body); color:var(--ink-2) }\n.spark { margin:0; padding:12px 12px 10px; border-radius:16px; background:var(--paper) }\n.spark svg { display:block; width:100%; height:auto }\n.spark .sg { stroke:var(--line); stroke-width:1; stroke-dasharray:3 3 }\n.spark .st { fill:var(--ink-2); font:600 9px var(--body); paint-order:stroke; stroke:var(--paper); stroke-width:3px; stroke-linejoin:round }\n.spark .sa { fill:var(--teal); fill-opacity:.12 }\n.spark .sl { fill:none; stroke:var(--teal); stroke-width:2; stroke-linejoin:round; stroke-linecap:round }\n.spark .sp { fill:#fff; stroke:var(--teal); stroke-width:2 }\n.spark figcaption { display:flex; justify-content:space-between; gap:8px; margin-top:6px; font-size:12px; color:var(--ink-2) }\n.from { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; font-size:14px; font-weight:600; color:var(--teal) }\n.empty { animation:rise .5s var(--ease-out) both; grid-column:1 / -1; display:grid; justify-items:start; gap:10px; padding:28px; border-radius:26px; border:1.5px dashed rgba(1,92,85,.3); color:var(--ink-2) }\n.empty b { font:700 20px/1.2 var(--display); color:var(--ink) }\n.empty p { margin:0; max-width:34em }\n\n/* Saved teams beside recent activity */\n.duo { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:20px; align-items:start }\n.duo .panel .sec-head { margin-bottom:6px }\n.duo h2 { font-size:clamp(1.5rem,2.2vw,1.8rem) }\n.teams { list-style:none; margin:0; padding:0 }\n.teams li + li { border-top:1px solid var(--line) }\n.trow { gap:16px; padding-block:16px }\n.form { display:flex; gap:4px }\n.form span { width:24px; height:24px; border-radius:7px; display:grid; place-items:center; font-size:12px; font-weight:700 }\n.form .W { background:var(--teal); color:#fff } .form .D { background:var(--mint-soft); color:var(--teal-900) } .form .L { background:#fff; color:var(--teal); box-shadow:inset 0 0 0 1.5px var(--teal) }\n.tnums { display:flex; gap:18px; margin:0 }\n.tnums dd { font-size:17px }\n.feed { list-style:none; margin:0; padding:0 }\n.feed li { display:grid; grid-template-columns:36px minmax(0,1fr); gap:12px; padding-block:12px }\n.feed li + li { border-top:1px solid var(--line) }\n.feed .ic { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--paper); color:var(--teal) }\n.feed p { margin:0; font-size:15px; line-height:1.4 }\n.feed .when { display:block; margin-top:2px; font-size:13px; color:var(--ink-2) }\n.feed li.fresh { animation:rise .5s var(--ease-out) both }\n\n.toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:60; display:flex; align-items:center; gap:14px; max-width:calc(100% - 32px); padding:10px 10px 10px 20px; border-radius:999px; background:var(--teal-900); color:#fff; font-size:15px; box-shadow:0 18px 40px rgba(0,20,18,.35);\n  opacity:0; visibility:hidden; transform:translate(-50%,24px); transition:opacity .25s, transform .35s var(--ease-out), visibility 0s .35s }\n.toast.on { opacity:1; visibility:visible; transform:translate(-50%,0); transition-delay:0s }\n.toast button { flex:none; height:34px; padding:0 14px; border-radius:999px; background:rgba(255,255,255,.12); color:var(--mint); font-weight:700 }\nfooter { background:var(--teal-900); color:rgba(255,255,255,.75); padding-block:36px calc(36px + env(safe-area-inset-bottom,0px)); font-size:14px }\nfooter .wrap { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap }\nfooter .logo { color:#fff; font-size:22px } footer .logo img { width:44px; height:44px; border-radius:13px; transform:none }\n\n@media (max-width:1100px) {\n  .top-grid { grid-template-columns:1fr; gap:44px }\n  .pgrid { grid-template-columns:repeat(2,minmax(0,1fr)) }\n  .duo { grid-template-columns:1fr }\n}\n@media (max-width:980px) {\n  .logo .wordmark { display:none } .logo { padding-right:0 } .logo .badge { width:44px; height:44px }\n  .nav-in { padding:5px; gap:4px } .nav-links { font-size:14px; gap:0 } .nav-links a { padding:10px 9px }\n  .nav-cta { height:40px; padding:0 14px; font-size:14px; margin-left:2px }\n}\n@media (max-width:860px) {\n  .row { grid-template-columns:96px minmax(0,1fr); grid-template-areas:\"thumb main\" \"thumb chip\" \"stats stats\"; gap:10px 16px }\n  .row-stats { grid-template-columns:repeat(3,minmax(0,1fr)); padding-top:4px }\n  .go { display:none }\n}\n@media (max-width:600px) {\n  .wrap { padding-inline:16px }\n  .nav-links { display:none }\n  .top { padding-block:calc(100px + env(safe-area-inset-top,0px)) 96px }\n  .meta { grid-template-columns:repeat(2,minmax(0,1fr)); row-gap:22px }\n  .cv-run, .latest { padding:20px; border-radius:22px } .latest { grid-template-columns:96px minmax(0,1fr); column-gap:14px }\n  .sheet { border-radius:28px 28px 0 0; padding-top:36px }\n  .block + .block { margin-top:56px }\n  .panel { p bel: r.spark_label || 'Top speed per 10 min', opp: r.opponent || '', day: r.match_day || '',\n  href: isUuid(r.match_ref) ? `app.html#report/${r.match_ref}` : DEMO });\n/* Activity text is built here from plain fields, so stored text is always escaped */\nconst ACTIVITY_TEXT = {\n  run: a => `Started analyzing <b>${esc(a.subject)}<\/b>`,\n  ready: a => `<b>${esc(a.subject)}<\/b> is ready`,\n  save: a => `Saved ${a.detail === 'team' ? 'team' : 'player'} <b>${esc(a.subject)}<\/b>`,\n  export: a => `Exported the ${esc(a.detail || 'report')} for <b>${esc(a.subject)}<\/b>`,\n};\nconst fromActivityRow = r => ({ when: whenLabel(r.created_at), kind: r.kind, text: ACTIVITY_TEXT[r.kind](r) });\nconst hrefOf = m => (m.cloud ? `app.html#report/${m.id}` : DEMO);\nasync function loadCloud() {\n  const before = metaValues();\n  try {\n    const [rows, players, teams, acts] = await Promise.all([\n      db('matches', 'GET', '?select=*&order=created_at.desc&limit=50'),\n      db('saved_players', 'GET', '?select=*&order=created_at.desc&limit=100'),\n      db('saved_teams', 'GET', '?select=*&order=created_at.asc&limit=100'),\n      db('activity', 'GET', '?select=*&order=created_at.desc&limit=20')]);\n    matches = [...rows.map(fromRow), ...matches];\n    players.forEach(r => playerData.set(r.id, fromPlayerRow(r)));\n    teams.forEach(r => teamRows.set(r.name, r));\n    savedPlayers = players.map(r => r.id); savedTeams = teams.map(r => r.name);\n    activity = [...activity.filter(a => a.fresh), ...acts.map(fromActivityRow)];\n  } catch (err) {\n    console.error(err); toast('Couldn\\'t load your saved data. Check your connection and refresh.');\n    savedPlayers = savedPlayers || []; savedTeams = savedTeams || [];\n  }\n  renderAll(before);\n}\n/* Sample clubs keep their crest; any other team gets its initials and a tone picked from its name */\nconst toneOf = name => (CLUBS[name] ? CLUBS[name].tone : `t${(Math.abs(seedOf(name)) % 5) + 1}`);\nconst codeOf = name => (CLUBS[name] ? CLUBS[name].code : name.split(/\\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase());\nconst crest = name => `<span class=\"crest ${toneOf(name)}\" aria-hidden=\"true\">${esc(codeOf(name))}<\/span>`;\n\n/* ---------- Heatmap thumbnails: a few seeded blobs on a 15 × 10 grid, same idea as the demo's 21 × 14 heatmaps ---------- */\nfunction rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nconst COLS = 15, ROWS = 10, CW = 105 / COLS, CH = 68 / ROWS, heatCache = new Map();\nfunction heatCells(seed) {\n  if (heatCache.has(seed)) return heatCache.get(seed);\n  const r = rng(seed), blobs = Array.from({ length: 4 }, () => ({ x: 22 + r() * 62, y: 10 + r() * 48, s: 9 + r() * 8, w: .55 + r() * .45 }));\n  const raw = Array.from({ length: COLS * ROWS }, (_, k) => {\n    const i = k % COLS, j = Math.floor(k / COLS), cx = (i + .5) * CW, cy = (j + .5) * CH;\n    return { i, j, v: blobs.reduce((a, b) => a + b.w * Math.exp(-((cx - b.x) ** 2 + (cy - b.y) ** 2) / (2 * b.s * b.s)), 0) };\n  });\n  const max = Math.max(...raw.map(c => c.v)), cells = raw.map(c => ({ ...c, v: c.v / max })).filter(c => c.v > .14);\n  heatCache.set(seed, cells);\n  return cells;\n}\nconst PITCH_LINES = '<g class=\"tl\"><rect x=\"1.5\" y=\"1.5\" width=\"102\" height=\"65\" rx=\"1.5\"/><line x1=\"52.5\" y1=\"1.5\" x2=\"52.5\" y2=\"66.5\"/><circle cx=\"52.5\" cy=\"34\" r=\"9.15\"/><rect x=\"1.5\" y=\"14\" width=\"16\" height=\"40\"/><rect x=\"87.5\" y=\"14\" width=\"16\" height=\"40\"/><\/g>';\nconst thumb = (m, strength) => `<svg viewBox=\"0 0 105 68\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><rect class=\"pf\" width=\"105\" height=\"68\"/>${heatCells(m.seed).map(c =>\n  `<rect class=\"hc\" x=\"${(c.i * CW).toFixed(2)}\" y=\"${(c.j * CH).toFixed(2)}\" width=\"${CW.toFixed(2)}\" height=\"${CH.toFixed(2)}\" fill-opacity=\"${(c.v * .85 * strength).toFixed(2)}\"/>`).join('')}${PITCH_LINES}<\/svg>`;\n\n/* ---------- Header numbers ---------- */\nconst META = [\n  ['Matches analyzed', v => Math.round(v)], ['Video processed', v => `${v.toFixed(1)} h`],\n  ['Player tracks', v => Math.round(v)], ['Passes detected', v => Math.round(v).toLocaleString('en-US')]];\nfunction metaValues() {\n  const done = matches.filter(isReady);\n  return [done.length, done.reduce((a, m) => a + m.mins, 0) / 60, done.length * 22, done.reduce((a, m) => a + m.passes[0] + m.passes[1], 0)];\n}\n/* Pass the previous values to count up from them (same quartic ease-out as the landing's big 20) */\nfunction renderMeta(from) {\n  const to = metaValues(), start = !reduced && from ? from : to;\n  $('#meta').innerHTML = META.map(([k, fmt], i) => `<div><dt>${k}<\/dt><dd class=\"num\">${fmt(start[i])}<\/dd><\/div>`).join('');\n  if (start === to) return;\n  const dds = $$('#meta dd'), t0 = performance.now(), DUR = 700;\n  const tick = now => {\n    const p = Math.min(1, (now - t0) / DUR), e = 1 - (1 - p) ** 4;\n    dds.forEach((dd, i) => { dd.textContent = META[i][1](from[i] + (to[i] - from[i]) * e); });\n    if (p < 1) requestAnimationFrame(tick);\n  };\n  requestAnimationFrame(tick);\n}\n\n/* ---------- Past analyses ---------- */\nfunction row(m) {\n  const ready = isReady(m);\n  const stats = ready ? [['Possession', m.poss], ['Passes', m.passes], ['Shots', m.shots]].map(([k, v], i) => `<span style=\"--k:${i}\"><small>${k}<\/small><b class=\"num\">${v[0]}–${v[1]}<\/b><\/span>`).join('')\n    : '<span class=\"wait\">Stats appear when tracking finishes<\/span>';\n  return `<li data-id=\"${m.id}\"${m.id === justReady ? ' class=\"just-ready\"' : ''}><a class=\"row\" href=\"${hrefOf(m)}\">\n    <span class=\"thumb${ready ? '' : ' busy'}\">${thumb(m, ready ? 1 : runP)}<\/span>\n    <span class=\"row-main\"><span class=\"fixture\"><span>${esc(m.home)}<\/span>${ready ? `<span class=\"score num\">${m.score[0]}–${m.score[1]}<\/span>` : '<span class=\"vs\">vs<\/span>'}<span>${esc(m.away)}<\/span><\/span>\n      <span class=\"row-sub\">${esc(m.date)} · ${m.kind} · ${m.mins} min<\/span><\/span>\n    <span class=\"row-stats\">${stats}<\/span>\n    ${ready ? '<span class=\"chip ready\">Ready<\/span>' : m.id === RUN_ID ? `<span class=\"chip busy\">Analyzing <span class=\"num\" data-run-pct>${pct()}%<\/span><\/span>` : '<span class=\"chip busy\">Analyzing<\/span>'}\n    <span class=\"go\">${ICON.arrow}<\/span><\/a><\/li>`;\n}\nfunction renderAnalyses() {\n  const q = query.trim().toLowerCase();\n  const counts = { all: matches.length, ready: matches.filter(isReady).length, running: matches.filter(m => !isReady(m)).length };\n  $$('#seg button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.f === filter); b.querySelector('.n').textContent = counts[b.dataset.f]; });\n  $('#anCount').textContent = matches.length;\n  const list = matches.filter(m => (filter === 'all' || (filter === 'ready') === isReady(m)) && (!q || `${m.home} ${m.away}`.toLowerCase().includes(q)));\n  const why = q ? `No analyses match “${esc(query.trim())}”.` : 'Nothing is analyzing right now.';\n  $('#rows').innerHTML = list.length ? list.map(row).join('') : `<li class=\"none\"><p>${why}<\/p><button class=\"btn btn-ghost btn-sm\" id=\"showAll\">Show all analyses<\/button><\/li>`;\n}\n\n/* ---------- What the CV is analyzing now: progress creeps forward, then the match lands in the list as Ready ---------- */\nfunction renderRun() {\n  const m = matches.find(x => x.id === RUN_ID);\n  $('#cvRun').classList.toggle('arrive', !!justReady);\n  if (!m || isReady(m)) {\n    $('#cvRun').innerHTML = '<div class=\"run-top\" style=\"--k:0\"><div><small>All caught up<\/small><b>No analysis running<\/b><\/div><\/div><p class=\"run-meta\" style=\"--k:1\">Upload a match video and tracking starts right away.<\/p>';\n    return;\n  }\n  $('#cvRun').innerHTML = `<div class=\"run-top\"><div><small>Analyzing now<\/small><b>${esc(m.home)} vs ${esc(m.away)}<\/b><\/div><b class=\"run-pct num\" data-run-pct><\/b><\/div>\n    <div class=\"run-bar\" role=\"progressbar\" aria-label=\"Analysis progress\" aria-valuemin=\"0\" aria-valuemax=\"100\"><i id=\"runBar\"><\/i><\/div>\n    <p class=\"run-meta\"><span id=\"runStep\"><\/span><span class=\"num\" id=\"runEta\"><\/span><\/p>`;\n  updateRun();\n}\n/* Latest result: the newest finished match. When the running analysis completes it becomes the latest and rises in */\nfunction renderLatest() {\n  const m = matches.find(isReady), el = $('#latest');\n  el.hidden = !m;\n  if (!m) return;\n  el.href = hrefOf(m);\n  el.classList.toggle('arrive', m.id === justReady);\n  const stats = [['Possession', m.poss], ['Passes', m.passes], ['Shots', m.shots]].map(([k, v]) => `<span><small>${k}<\/small><b class=\"num\">${v[0]}–${v[1]}<\/b><\/span>`).join('');\n  el.setAttribute('aria-label', `Latest result: ${m.home} ${m.score[0]}–${m.score[1]} ${m.away}. Open the report`);\n  el.innerHTML = `<span class=\"thumb\" style=\"--k:0\">${thumb(m, 1)}<\/span>\n    <span class=\"lt-main\" style=\"--k:1\"><small>Latest result<\/small><span class=\"fixture\"><span>${esc(m.home)}<\/span><span class=\"score num\">${m.score[0]}–${m.score[1]}<\/span><span>${esc(m.away)}<\/span><\/span>\n      <span class=\"lt-sub\">${esc(m.date)} · ${m.kind} · ${m.mins} min<\/span><\/span>\n    <span class=\"lt-stats\" style=\"--k:2\">${stats}<\/span>\n    <span class=\"lt-go\" style=\"--k:3\">Open report ${ICON.arrow}<\/span>`;\n}\nfunction updateRun() {\n  const step = Math.min(STEPS.length - 1, Math.floor(runP * STEPS.length)), bar = $('#runBar');\n  $$('[data-run-pct]').forEach(el => el.textContent = `${pct()}%`);\n  if (!bar) return;\n  bar.style.transform = `scaleX(${runP})`; bar.parentElement.setAttribute('aria-valuenow', pct());\n  $('#runStep').textContent = `Step ${step + 1} of ${STEPS.length} · ${STEPS[step]}`;\n  $('#runEta').textContent = `About ${Math.max(1, Math.ceil((1 - runP) * 9))} min left`;\n}\n/* Finishing is the payoff moment, so it gets a beat: the progress card and the row's \"Analyzing\" parts fade out (160ms),\n   then the new state renders with the just-ready entrances and the header numbers count up from their old values */\nconst TICK_MS = 1500, TICK_STEP = .005, LEAVE_MS = 160;\nlet justReady = null;\nconst fadeOut = els => Promise.all(els.map(el => el.animate(\n  [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: reduced ? 'none' : 'translateY(-6px)' }],\n  { duration: LEAVE_MS, easing: EASE_OUT, fill: 'forwards' }).finished));\nconst ticker = setInterval(async () => {\n  runP = Math.min(1, runP + TICK_STEP);\n  if (runP < 1) { updateRun(); return; }\n  clearInterval(ticker);\n  const m = matches.find(x => x.id === RUN_ID), before = metaValues(), runRow = $(`#rows [data-id=\"${RUN_ID}\"]`);\n  /* a hidden tab has a frozen animation clock; don't hold the new state hostage to it (the entrances still play on return) */\n  if (!document.hidden) await fadeOut([...$('#cvRun').children, ...(runRow ? runRow.querySelectorAll('.chip, .vs, .row-stats') : [])]);\n  matches = matches.map(x => x.id === RUN_ID ? { ...x, ...x.result, status: 'ready' } : x);\n  activity = [{ when: 'Just now', kind: 'ready', text: `<b>${esc(m.home)} vs ${esc(m.away)}<\/b> is ready`, fresh: true }, ...activity];\n  justReady = RUN_ID; renderAll(before); justReady = null;\n  toast(`${m.home} vs ${m.away} is ready`);\n}, TICK_MS);\n\n/* ---------- Saved players ---------- */\n/* The line lives in the left part of the chart; the 30 km/h reference label gets its own gutter on the right, so the line can never run through it.\n   Padding scales with the data, so km/h values and 0–1 intensity values both fill the chart */\nfunction spark(vals) {\n  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;\n  const W = 200, H = 56, GUTTER = 44, lo = min - span * .35, hi = max + span * .25, peak = vals.indexOf(max);\n  const x = i => 6 + i * (W - GUTTER - 12) / (vals.length - 1), y = v => H - 6 - (v - lo) / (hi - lo) * (H - 16);\n  const pts = vals.map((v, i) => `${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('L');\n  const g = lo < 30 && hi > 30 ? `<line class=\"sg\" x1=\"0\" x2=\"${W - GUTTER + 2}\" y1=\"${y(30).toFixed(1)}\" y2=\"${y(30).toFixed(1)}\"/><text class=\"st\" x=\"${W}\" y=\"${y(30).toFixed(1)}\" dominant-baseline=\"middle\" text-anchor=\"end\">30 km/h<\/text>` : '';\n  return `<svg viewBox=\"0 0 ${W} ${H}\" aria-hidden=\"true\">${g}<path class=\"sa\" d=\"M${pts}L${x(vals.length - 1).toFixed(1)} ${H}L${x(0).toFixed(1)} ${H}Z\"/><path class=\"sl\" d=\"M${pts}\"/><circle class=\"sp\" cx=\"${x(peak).toFixed(1)}\" cy=\"${y(vals[peak]).toFixed(1)}\" r=\"4.5\"/><\/svg>`;\n}\nconst empty = kind => `<div class=\"empty\"><b>No saved ${kind}<\/b><p>${kind === 'players' ? 'Players' : 'Teams'} you save from an analysis show up here, with their numbers from that match.<\/p><a class=\"btn btn-teal btn-sm\" href=\"${NEW}\">New analysis ${ICON.arrow}<\/a><\/div>`;\nfunction renderPlayers() {\n  if (!savedPlayers) { $('#pCount').textContent = ''; $('#pgrid').innerHTML = ''; return; } /* still loading */\n  const list = savedPlayers.map(id => playerData.get(id));\n  $('#pCount').textContent = list.length;\n  $('#pgrid').innerHTML = list.length ? list.map(p => {\n    const speed = /speed/i.test(p.sparkLabel);\n    return `<article class=\"pcard\">\n      <header><span class=\"shirt ${toneOf(p.team)}\" aria-hidden=\"true\">${p.n}<\/span><div class=\"who\"><b>${esc(p.team)}<\/b><span>#${p.n} · ${esc(p.pos)}<\/span><\/div>\n        <button class=\"save\" data-unsave=\"p:${p.id}\" aria-label=\"Remove #${p.n} ${esc(p.team)} from saved players\" title=\"Remove from saved\">${ICON.saved}<\/button><\/header>\n      <dl class=\"pstats\"><div><dt>Distance<\/dt><dd class=\"num\">${(+p.dist).toFixed(1)}<small>km<\/small><\/dd><\/div><div><dt>Top speed<\/dt><dd class=\"num\">${(+p.top).toFixed(1)}<small>km/h<\/small><\/dd><\/div><div><dt>Sprints<\/dt><dd class=\"num\">${p.sprints}<\/dd><\/div><\/dl>\n      <figure class=\"spark\">${spark(p.spark)}<figcaption><span>${esc(p.sparkLabel)}<\/span>${speed ? `<span class=\"num\">Peak ${(+p.top).toFixed(1)}<\/span>` : ''}<\/figcaption><\/figure>\n      <a class=\"from\" href=\"${p.href}\"><span>vs ${esc(p.opp)} · ${esc(p.day)}<\/span>${ICON.arrow}<\/a><\/article>`;\n  }).join('') : empty('players');\n}\n\n/* ---------- Saved teams: form and averages are derived from the analyses, so a finished analysis updates them ---------- */\nconst WORD = { W: 'won', D: 'drew', L: 'lost' };\nfunction teamSummary(name) {\n  const ms = matches.filter(m => isReady(m) && (m.home === name || m.away === name)).reverse(); /* oldest first */\n  const side = m => (m.home === name ? 0 : 1);\n  return {\n    n: ms.length,\n    form: ms.map(m => { const a = m.score[side(m)], b = m.score[1 - side(m)]; return a > b ? 'W' : a < b ? 'L' : 'D'; }).slice(-5),\n    poss: ms.length ? `${Math.round(mean(ms.map(m => m.poss[side(m)])))}%` : '—',\n    goals: ms.length ? mean(ms.map(m => m.score[side(m)])).toFixed(1) : '—',\n  };\n}\nfunction renderTeams() {\n  if (!savedTeams) { $('#tCount').textContent = ''; $('#tlist').innerHTML = ''; return; } /* still loading */\n  $('#tCount').textContent = savedTeams.length;\n  $('#tlist').innerHTML = savedTeams.length ? `<ul class=\"teams\">${savedTeams.map(name => {\n    const s = teamSummary(name);\n    return `<li class=\"trow\">${crest(name)}<div class=\"who\"><b>${esc(name)}<\/b><span>${s.n} ${s.n === 1 ? 'match' : 'matches'} analyzed<\/span><\/div>\n      <div class=\"form\" role=\"img\" aria-label=\"Results, oldest to newest: ${s.form.map(r => WORD[r]).join(', ') || 'none yet'}\">${s.form.map(r => `<span class=\"${r}\">${r}<\/span>`).join('')}<\/div>\n      <dl class=\"tnums\"><div><dt>Possession<\/dt><dd class=\"num\">${s.poss}<\/dd><\/div><div><dt>Goals / match<\/dt><dd class=\"num\">${s.goals}<\/dd><\/div><\/dl>\n      <button class=\"save\" data-unsave=\"t:${esc(name)}\" aria-label=\"Remove ${esc(name)} from saved teams\" title=\"Remove from saved\">${ICON.saved}<\/button><\/li>`;\n  }).join('')}<\/ul>` : empty('teams');\n}\n\nfunction renderActivity() {\n  $('#feed').innerHTML = activity.map(a => `<li${a.fresh ? ' class=\"fresh\"' : ''}><span class=\"ic\">${ICON[a.kind]}<\/span><div><p>${a.text}<\/p><span class=\"when\">${a.when}<\/span><\/div><\/li>`).join('');\n  activity = activity.map(a => (a.fresh ? { ...a, fresh: false } : a));\n}\nfunction renderAll(metaFrom) { renderMeta(metaFrom); renderRun(); renderLatest(); renderAnalyses(); renderPlayers(); renderTeams(); renderActivity(); }\n\n/* ---------- Unsave with undo; focus moves to the next bookmark, or the section heading when the list empties ---------- */\nlet toastTimer = 0, undoFn = null;\nfunction toast(msg, undo) {\n  $('#toastMsg').textContent = msg; undoFn = undo || null; $('#toastUndo').hidden = !undo;\n  $('#toast').classList.add('on'); clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => $('#toast').classList.remove('on'), 5000);\n}\n$('#toastUndo').addEventListener('click', () => { if (undoFn) undoFn(); undoFn = null; $('#toast').classList.remove('on'); });\n/* Removing a card: it settles away (opacity + slight shrink), then its neighbours glide into the gap instead of jumping.\n   FLIP: measure every remaining item, change the DOM, then animate each one from its old spot to its new one.\n   Positions are read from the live layout, so a glide that is interrupted restarts from where the card is on screen */\nconst EXIT_MS = 180, ENTER_MS = 220, GLIDE_MS = 260;\nconst itemOf = el => el.closest('.pcard, .trow');\nconst items = kind => $$(kind === 'p' ? '#pgrid > .pcard' : '#tlist .trow');\nconst keyOf = el => el.querySelector('[data-unsave]').dataset.unsave;\nfunction glide(kind, mutate) {\n  const before = new Map(items(kind).map(el => [keyOf(el), el.getBoundingClientRect()]));\n  mutate();\n  if (reduced) return;\n  items(kind).forEach(el => {\n    const a = before.get(keyOf(el)); if (!a) return;\n    const b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;\n    if (dx || dy) el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: GLIDE_MS, easing: EASE_IN_OUT });\n  });\n}\nfunction unsave(kind, id, btn) {\n  const players = kind === 'p', prev = players ? savedPlayers : savedTeams, at = prev.indexOf(id);\n  const next = prev.filter(x => x !== id), render = players ? renderPlayers : renderTeams;\n  const store = list => { if (players) savedPlayers = list; else savedTeams = list; };\n  const p = players && playerData.get(id);\n  /* the cloud copy is deleted now; undo puts the same row back once that delete has landed */\n  const table = players ? 'saved_players' : 'saved_teams', row = players ? p.row : teamRows.get(id);\n  const removed = db(table, 'DELETE', players ? `?id=eq.${id}` : `?name=eq.${encodeURIComponent(id)}`)\n    .catch(err => { console.error(err); toast('Couldn\\'t remove it from the cloud. It will come back when you refresh.'); });\n  let undone = false;\n  store(next); /* state changes now; only the picture waits for the exit */\n  $(players ? '#pCount' : '#tCount').textContent = next.length;\n  /* undo: re-render, glide the others back apart, and let the restored card settle in where it was */\n  toast(players ? `Removed #${p.n} ${p.team} from saved players` : `Removed ${id} from saved teams`, () => {\n    removed.then(() => db(table, 'POST', '', row)).catch(err => { console.error(err); toast('Couldn\\'t restore it in the cloud.'); });\n    undone = true; store(prev); glide(kind, render);\n    const back = $(`[data-unsave=\"${kind}:${CSS.escape(id)}\"]`);\n    if (back) itemOf(back).animate([{ opacity: 0, transform: reduced ? 'none' : 'scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: ENTER_MS, easing: EASE_OUT });\n  });\n  const card = btn && itemOf(btn);\n  const finish = () => {\n    if (undone) return; /* undo landed mid-exit and already re-rendered the card */\n    /* remove just this card, so another card that is mid-exit keeps its own fade; the last one out swaps in the empty state */\n    if (next.length && card && card.isConnected) glide(kind, () => card.remove()); else render();\n    const left = $$(`[data-unsave^=\"${kind}:\"]`).filter(b => !itemOf(b).classList.contains('leaving'));\n    (left[Math.min(at, left.length - 1)] || $(players ? '#pTitle' : '#tTitle')).focus();\n  };\n  if (!card) return finish();\n  card.classList.add('leaving'); card.style.pointerEvents = 'none';\n  card.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: reduced ? 'none' : 'scale(.96)' }], { duration: EXIT_MS, easing: EASE_OUT, fill: 'forwards' }).finished.then(finish);\n}\ndocument.addEventListener('click', e => {\n  const btn = e.target.closest('[data-unsave]');\n  if (btn) { const k = btn.dataset.unsave, cut = k.indexOf(':'); unsave(k.slice(0, cut), k.slice(cut + 1), btn); return; }\n  if (e.target.closest('#showAll')) { filter = 'all'; query = ''; $('#q').value = ''; renderAnalyses(); $('#anTitle').focus(); }\n});\n$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; renderAnalyses(); });\n$('#q').addEventListener('input', e => { query = e.target.value; renderAnalyses(); });\n\n/* ---------- Nav: a hover pill that glides between links (same as the landing) ---------- */\n{\n  const links = $('.nav-links');\n  if (matchMedia('(hover:hover) and (pointer:fine)').matches) {\n    const hl = document.createElement('span'); hl.className = 'nav-hl fresh'; hl.setAttribute('aria-hidden', 'true'); links.appendChild(hl);\n    const to = a => {\n      hl.classList.toggle('fresh', hl.style.opacity !== '1');\n      hl.style.width = a.offsetWidth + 'px'; hl.style.height = a.offsetHeight + 'px';\n      hl.style.transform = `translate(${a.offsetLeft}px,${a.offsetTop}px)`; hl.style.opacity = '1';\n    };\n    links.querySelectorAll('a').forEach(a => { a.addEventListener('pointerenter', () => to(a)); a.addEventListener('focus', () => { if (a.matches(':focus-visible')) to(a); }); a.addEventListener('blur', () => hl.style.opacity = '0'); });\n    links.addEventListener('pointerleave', () => hl.style.opacity = '0');\n  }\n}\n\nrenderAll();\nloadCloud();\n})();\n<\/script>\n<\/html>\n", "app": "<meta charset=\"utf-8\"><script>(function(){var R=/^(?:\\.\\/)?(index|dashboard|app)\\.html(#.*)?$/;\nwindow.__go=function(t){t=String(t);if(/^\\.\\/?$|^\\/$/.test(t))t='index.html';var m=t.match(R);if(!m)return false;\ntry{sessionStorage.setItem('trivela.page',m[1])}catch(_){}\nhistory.pushState({page:m[1]},'',location.pathname+location.search+(m[2]||''));location.reload();return true};\ndocument.addEventListener('click',function(e){if(e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;\nvar a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href');\nif(!R.test(h)&&!/^\\.\\/?$/.test(h))return;e.preventDefault();e.stopPropagation();window.__go(h)},true);\naddEventListener('popstate',function(e){if(e.state&&e.state.page)location.reload()});})();<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<link rel=\"icon\" type=\"image/jpeg\" href=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAEAAQADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJ

match screens use a segmented control for Overview / Video / Team / Players. */\n:root {\n  --bg:#FFFFFF; --surface:#F2F8F7; --surface-2:#FFFFFF; --fg:#06201D; --fg-2:#4A6663; --fg-3:#8AA19E;\n  --line:rgba(1,92,85,.12); --brand:#015C55; --brand-700:#014B45; --brand-50:#E6F2F0; --on-brand:#FFFFFF;\n  --home:#015C55; --away:#E07A3F; --ball:#FFD60A; --good:#248A3D;\n  --pitch:#EAF3F1; --pitch-line:#BFD9D4; --glass:rgba(255,255,255,.72); --scrim:rgba(0,0,0,.28);\n  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.07);\n  --font:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Inter\",system-ui,\"Segoe UI\",sans-serif;\n  --ease:cubic-bezier(.2,.8,.2,1);\n  /* Brand world shared with the landing. The Matches screen uses these in every theme: teal and white only. */\n  --teal:#015C55; --teal-700:#014B45; --teal-900:#012F2B; --teal-500:#0B8478; --mint:#8FE8DA; --mint-soft:#D3F5EF;\n  --paper:#F2F8F7; --ink:#06201D; --ink-2:#4A6663; --tline:rgba(1,92,85,.14);\n  --display:\"Bricolage Grotesque\",\"Avenir Next\",\"Segoe UI\",system-ui,sans-serif;\n  --body:\"DM Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);\n}\n* { box-sizing:border-box }\nhtml { background:linear-gradient(var(--teal) 0 520px, #fff 520px); color-scheme:light }\nbody { margin:0; background:transparent; color:var(--fg); font:15px/1.47 var(--body); -webkit-font-smoothing:antialiased; letter-spacing:-.005em }\nbutton { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0 }\nbutton:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent); outline-offset:2px; border-radius:10px }\n.num { font-variant-numeric:tabular-nums }\n\n/* Top bar (glass) */\n  backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-bottom:1px solid var(--line) }\n\nmain { max-width:1180px; margin:0 auto; padding:28px 20px 80px }\n\n/* Buttons: feedback on press, not release */\n.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 18px; border-radius:999px;\n  font-weight:600; font-size:15px; transition:transform .12s var(--ease), background .2s, opacity .2s; user-select:none; white-space:nowrap }\n.btn:active { transform:scale(.96) }\n.btn-primary { background:var(--brand); color:var(--on-brand) }\n.btn-primary:hover { background:var(--brand-700) }\n.btn-ghost { color:var(--brand); padding:0 10px }\n.btn-lg { height:50px; padding:0 26px; font-size:17px }\n.btn[disabled] { opacity:.4; pointer-events:none }\n\nh1 { font-size:34px; line-height:1.1; letter-spacing:-.025em; font-weight:700; margin:0; text-wrap:balance }\nh2 { font-size:22px; line-height:1.2; letter-spacing:-.018em; font-weight:600; margin:0 }\nh3 { font-size:17px; letter-spacing:-.012em; font-weight:600; margin:0 }\n.sub { color:var(--fg-2); margin:6px 0 0 }\n.label { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-2) }\n\n.card { background:var(--surface); border-radius:16px; padding:20px }\n\n.sw { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none }\n.muted { color:var(--fg-2); font-size:13px }\n\n/* Library (Matches). Layout: a teal hero with the title, the main action and a live tracking feed; a white sheet slides over it\n   holding a bento library (the newest match as a teal feature card, the new-analysis tile beside it) and the four-step flow.\n   Teal and white in every theme, like the landing. Entrance animations use fill-mode backwards so hover transforms still apply after them. */\nbody:is([data-route=\"home\"],[data-route=\"upload\"],[data-route=\"processing\"]) { background:linear-gradient(var(--teal) 0 50%, #fff 50% 100%) }\nbody:is([data-route=\"home\"],[data-route=\"upload\"],[data-route=\"processing\"]) { font-family:var(--body) }\nbody:is([data-route=\"home\"],[data-route=\"upload\"],[data-route=\"processing\"]) main { max-width:none; padding:0 }\nbody:is([data-route=\"home\"],[data-route=\"upload\"],[data-route=\"processing\"]) .view { animation:none }\nbody:is([data-route=\"home\"],[data-route=\"upload\"],[data-route=\"processing\"]) :focus-visible { outline-color:var(--teal-500) }\nbody:is([data-route=\"home\"],[data-route=\"upload\"],[data-route=\"processing\"]) .hero :focus-visible, body:is([data-route=\"home\"],[data-route=\"upload\"],[data-route=\"processing\"]) .nav :focus-visible { outline-color:var(--mint) }\n@keyframes rise { from { opacity:0; transform:translateY(18px) } }\n@keyframes charUp { from { transform:translateY(110%) rotate(5deg) } }\n@keyframes feedIn { from { opacity:0; transform:translateY(32px) scale(.96) } }\n@keyframes sheetUp { from { transform:translateY(96px) } }\n@keyframes shoot { 0% { transform:translateY(0) } 45% { transform:translateY(-150%); opacity:0 } 46% { transform:translateY(150%); opacity:0 } 100% { transform:translateY(0); opacity:1 } }\n@keyframes ants { to { stroke-dashoffset:-5 } }\n.rise { animation:rise .8s calc(.25s + var(--i,0) * 90ms) var(--ease-out) backwards }\n.lib-wrap { max-width:1180px; margin:0 auto; padding-inline:20px }\n\n/* Hero: mowing stripes and one centre-circle arc, nothing decorative that isn't from a pitch */\n.hero { position:relative; overflow:hidden; isolation:isolate; color:#fff; padding:116px 0 132px }\n.hero::before { content:\"\"; position:absolute; inset:0; z-index:-1; background:repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 90px, transparent 90px 180px) }\n.hero::after { content:\"\"; position:absolute; z-index:-1; width:860px; aspect-ratio:1; left:-380px; bottom:-560px; border-radius:50%; border:1.5px solid rgba(255,255,255,.09) }\n.hero-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.12fr); gap:56px; align-items:center }\n.eyebrow { display:inline-flex; align-items:center; gap:8px; font:600 12px/1 var(--body); letter-spacing:.14em; text-transform:uppercase; color:var(--mint) }\n.hero h1 { display:flex; align-items:flex-start; margin:14px 0 0; font:800 clamp(64px,9.4vw,132px)/.9 var(--display); letter-spacing:-.055em }\n.hero h1 .ch { display:inline-block; transform-origin:0 100%; animation:charUp 1s calc(.15s + var(--i) * 45ms) cubic-bezier(.2,.9,.1,1) backwards }\n.hero h1 sup { margin:.42em 0 0 .3em; padding:6px 10px; border-radius:999px; border:1.5px solid rgba(143,232,218,.5); color:var(--mint); font:600 clamp(14px,1.5vw,18px)/1 var(--body); letter-spacing:0 }\n.lede { margin:22px 0 0; max-width:28em; font-size:clamp(17px,1.5vw,19px); line-height:1.5; color:rgba(255,255,255,.8) }\n\n/* Keycap button: a white face on a mint edge. It rises on hover and sinks flush on press */\n.key { --edge:5px; --y:0px; display:inline-flex; align-items:center; gap:14px; height:58px; padding:0 9px 0 24px; border-radius:18px; background:#fff; color:var(--teal);\n  font:700 18px/1 var(--display); letter-spacing:-.02em; white-space:nowrap; user-select:none;\n  box-shadow:0 var(--edge) 0 #7FD6C8, 0 calc(var(--edge) + 18px) 34px -6px rgba(0,20,18,.5);\n  transform:translateY(var(--y)); transition:transform .18s var(--ease-out), box-shadow .18s var(--ease-out) }\n.key:active { --edge:0px; --y:5px; transition-duration:.07s }\n.key kbd { font:600 12px/1 var(--body); border:0; border-radius:6px; padding:5px 7px; color:var(--teal-500); background:var(--mint-soft) }\n@media (hover:none) { .key kbd { display:none } }\n.key-ico { width:40px; height:40px; border-radius:12px; background:var(--teal); color:#fff; display:grid; place-items:center; overflow:hidden }\n.mint-link { display:inline-flex; align-items:center; gap:6px; height:44px; color:var(--mint); font:600 16px/1 var(--display); letter-spacing:-.01em;\n  background:linear-gradient(currentColor,currentColor) 0 calc(100% - 8px) / 0 1.5px no-repeat; transition:background-size .35s var(--ease-out), color .2s }\n.mint-link svg { transition:transform .25s var(--ease-out) }\n@media (hover:hover) and (pointer:fine) {\n  .key:hover { --edge:7px; --y:-2px }\n  .key:hover .key-ico svg { animation:shoot .55s var(--ease-out) }\n  .mint-link:hover { color:#fff; background-size:calc(100% - 20px) 1.5px }\n  .mint-link:hover svg { transform:translateX(4px) }\n}\n\n/* Sheet */\n.lib { position:relative; z-index:2; margin-top:-48px; min-height:60vh; padding:64px 0 120px; border-radius:44px 44px 0 0; background:#fff; color:var(--ink);\n  --pitch:#E6F2F0; --pitch-line:#BFD9D4; animation:sheetUp 1s .12s var(--ease-out) backwards }\n\n/* Job progress bar (processing screen) */\n.jbar { display:block; height:6px; border-radius:6px; background:rgba(255,255,255,.16); overflow:hidden }\n.jbar i { display:block; height:100%; border-radius:6px; background:var(--mint); transform-origin:left; transform:scaleX(var(--p,0)); transition:transform .3s linear }\n\n/* Upload + Processing: same teal hero and white sheet as Matches */\nbody:is([data-route=\"upload\"],[data-route=\"processing\"]) .sheet { --bg:#fff; --surface:#F2F8F7; --surface-2:#fff; --fg:#06201D; --fg-2:#4A6663; --fg-3:#8AA19E; --line:rgba(1,92,85,.14); --brand:#015C55; --brand-50:#E6F2F0; --on-brand:#fff; --scrim:rgba(1,47,43,.5); font-family:var(--body); color-scheme:light }\nbody:is([data-route=\"upload\"],[data-route=\"processing\"]) .sheet h2 { font-family:var(--display); letter-spacing:-.03em }\nbody:is([data-route=\"upload\"],[data-route=\"processing\"]) .sheet .btn-primary { background:var(--teal); color:#fff; border-radius:14px; font-family:var(--display); letter-spacing:-.01em; box-shadow:0 4px 0 var(--teal-900); transition:transform .18s var(--ease-out), box-shadow .18s var(--ease-out) }\nbody:is([data-route=\"upload\"],[data-route=\"processing\"]) .sheet .btn-primary:active { transform:translateY(4px); box-shadow:0 0 0 var(--teal-900) }\n.hero.compact { padding:104px 0 112px }\n.hero.compact .hero-grid { grid-template-columns:minmax(0,1.2 >\n<\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n<script>/* Trivela ⇄ Tactical Engine (the YOLO model server running on Colab behind a Cloudflare tunnel).\n   Client for its HTTP API, plus toReport(): engine summary -> the stats, player rows and info the app saves to Supabase.\n   Engine team codes: 0 = team A (darker kit), 1 = team B (lighter kit), 2 = goalkeeper, 3 = official. */\n(function (root) {\n  'use strict';\n\n  const STORE_KEY = 'trivela.engineUrl';\n  const CHUNK_SIZE = 4 * 1024 * 1024;   // matches the engine's own uploader; well under the tunnel's 100 MB request cap\n  const CHUNK_RETRIES = 4;\n  const MIN_PLAYER_SECS = 3;            // shorter tracks are fragments, not players\n  const MAX_PLAYERS = 40;\n\n  /* Every stat the engine measures, in report order. u = unit suffix, d = decimals, f: 'time' = seconds shown as m:ss,\n     est = estimated from pitch positions the model infers from the broadcast view */\n  const STAT_DEFS = [\n    { g: 'Possession', k: 'Possession', u: '%' },\n    { g: 'Possession', k: 'Touches' },\n    { g: 'Possession', k: 'Touches in opposition box', est: 1 },\n    { g: 'Possession', k: 'Time in final third', f: 'time', est: 1 },\n    { g: 'Passing', k: 'Passes' },\n    { g: 'Passing', k: 'Pass accuracy', u: '%' },\n    { g: 'Passing', k: 'Long balls', est: 1 },\n    { g: 'Passing', k: 'Crosses', est: 1 },\n    { g: 'Passing', k: 'Balls won' },\n    { g: 'Attacking', k: 'Shots', est: 1 },\n    { g: 'Attacking', k: 'Shots on target', est: 1 },\n    { g: 'Attacking', k: 'xG', d: 2, est: 1 },\n    { g: 'Attacking', k: 'Dribbles', est: 1 },\n    { g: 'Attacking', k: 'Corners', est: 1 },\n    { g: 'Attacking', k: 'Free kicks', est: 1 },\n    { g: 'Attacking', k: 'Strikes' },\n    { g: 'Defending', k: 'Tackles', est: 1 },\n    { g: 'Defending', k: 'Interceptions', est: 1 },\n    { g: 'Defending', k: 'Clearances', est: 1 },\n    { g: 'Defending', k: 'Defensive contribution', est: 1 },\n m, f) => outfield.filter(x => x.team === team).reduce((t, x) => t + num(f(x.p)), 0);\n    const teamMax = (team, f) => outfield.filter(x => x.team === team).reduce((t, x) => Math.max(t, num(f(x.p))), 0);\n    const byTeam = f => ['home', 'away'].map(f);\n\n    // Per-player passing from the event log: [frame, 'pass', receiver, team, passer] and [frame, 'won', winner, team, loser]\n    const passed = {}, lost = {}, strikes = [0, 0];\n    for (const [, type, , team, extra] of events) {\n      if (type === 'pass') passed[extra] = (passed[extra] || 0) + 1;\n      else if (type === 'won') lost[extra] = (lost[extra] || 0) + 1;\n      else if (type === 'strike' && (team === 0 || team === 1)) strikes[team] += 1;\n    }\n\n    const stats = {\n      Possession: pair(Math.round(num(s.possession_a)), Math.round(num(s.possession_b))),\n      Touches: byTeam(t => teamSum(t, p => p.touches)),\n      Passes: pair(num(s.passes_a), num(s.passes_b)),\n      'Pass accuracy': pair(Math.round(num(s.pass_acc_a)), Math.round(num(s.pass_acc_b))),\n      'Balls won': pair(num(s.gains_a), num(s.gains_b)),\n      Strikes: pair(strikes[0], strikes[1]),\n      'Distance covered': byTeam(t => fix(teamSum(t, p => p.dist_m) / 1000, 2)),\n      'Top speed': byTeam(t => fix(teamMax(t, p => p.top_kmh), 1)),\n      'Sprints >25 km/h': byTeam(t => teamSum(t, p => p.sprints)),\n    };\n    // Event stats: engines from before the pitch-mapping update don't send them, and the report then leaves them out\n    if ('shots_a' in s) Object.assign(stats, {\n      'Touches in opposition box': pair(num(s.box_touches_a), num(s.box_touches_b)),\n      'Time in final third': pair(num(s.final_third_s_a), num(s.final_third_s_b)),\n      'Long balls': pair(num(s.long_balls_a), num(s.long_balls_b)),\n      Crosses: pair(num(s.crosses_a), num(s.crosses_b)),\n      Shots: pair(num(s.shots_a), num(s.shots_b)),\n      'Shots on target': pair(num(s.shots_on_a), num(s.shots_on_b)),\n      xG: pair(fix(s.xg_a, 2), fix(s.xg_b, 2)),\n      Dribbles: pair(num(s.dribbles_a), num(s.dribbles_b)),\n      Corners: pair(num(s.corners_a), num(s.corners_b)),\n      'Free kicks': pair(num(s.free_kicks_a), num(s.free_kicks_b)),\n      Tackles: pair(num(s.tackles_a), num(s.tackles_b)),\n      Interceptions: pair(num(s.interceptions_a), num(s.interceptions_b)),\n      Clearances: pair(num(s.clearances_a), num(s.clearances_b)),\n      'Defensive contribution': pair(num(s.def_actions_a), num(s.def_actions_b)),\n      Dispossessed: pair(num(s.dispossessed_a), num(s.dispossessed_b)),\n      Saves: pair(num(s.saves_a), num(s.saves_b)),\n      'Fastest strike': pair(Math.round(num(s.fastest_strike_a)), Math.round(num(s.fastest_strike_b))),\n    });\n    if ('sprint_kmh_a' in s) stats['Avg sprint speed'] = pair(fix(s.sprint_kmh_a, 1), fix(s.sprint_kmh_b, 1));\n\n    const px = {};\n    const players_ = outfield\n      .filter(x => num(x.p.secs) >= MIN_PLAYER_SECS)\n      .sort((a, b) => num(b.p.secs) - num(a.p.secs) || a.id - b.id)\n      .slice(0, MAX_PLAYERS)\n      .map(({ id, p, team }) => {\n        const done = passed[id] || 0, tries = done + (lost[id] || 0);\n        if ('tackles' in p) {\n          const heat = (Array.isArray(p.heat) ? p.heat : []).map(num);\n          px['t' + id] = { ...Object.fromEntries(PLAYER_EXTRAS.map(k => [k, num(p[k])])), heat: homeCode === 1 ? heat.reverse() : heat };\n        }\n        return {\n          player_key: 't' + id, team, jersey: null, pos: null,\n          distance: fix(num(p.dist_m) / 1000, 3), top_speed: fix(p.top_kmh, 1), sprints: num(p.sprints),\n          passes: done, accuracy: tries ? Math.round(done / tries * 100) : null, touches: num(p.touches), intensity: null,\n        };\n      });\n\n    const kit = summary.team_colors || {};\n    const engine = {\n      base, home_kit: homeCode === 1 ? 'b' : 'a', tracker: summary.tracker || null, mode: summary.mode || null,\n      fps: num(summary.fps), duration_s: summary.fps ? Math.round(num(summary.total_frames) / num(summary.fps)) : 0,\n      kit: { home: (homeCode === 0 ? kit.team_a : kit.team_b) || null, away: (homeCode === 0 ? kit.team_b : kit.team_a) || null },\n      kit_learned: !!summary.kit_learned,\n      ball: { visible_pct: num(s.ball_visible_pct), max_kmh: num(s.ball_max_kmh), avg_kmh: num(s.ball_avg_kmh) },\n      wide_pct: num(s.wide_pct), swaps_fixed: num(s.swaps_fixed), tracks: outfield.length,\n      maps: summary.maps ? toMaps(summary.maps, homeCode) : null, px, pitch: summary.pitch || null,\n    };\n    return { stats, players: players_, engine };\n  }\n\n  /* ---------- HTTP client (browser only) ---------- */\n  function getBase() {\n    try { return normalizeBase(localStorage.getItem(STORE_KEY)); } catch (_) { return null; }\n  }\n  function setBase(url) {\n    const b = normalizeBase(url);\n    try { if (b) localStorage.setItem(STORE_KEY, b); else localStorage.removeItem(STORE_KEY); } catch (_) { /* storage blocked: lasts this page only */ }\n    return b;\n  }\n\n  async function call(base, path, init) {\n    let res;\n    try { res = await fetch(base + path, init); } catch (err) {\n      if (err && err.name === 'AbortError') throw err;\n      throw new Error('Can\\'t reach the model server. Is the engine still running?');\n    }\n    const text = await res.text();\n    let body = null;\n    try { body = text ? JSON.parse(text) : null; } catch (_) { body = null; }\n    if (!res.ok) throw Object.assign(new Error((body && (body.error || body.detail)) || `Model server error ${res.status}`), { status: res.status });\n    return body;\n  }\n\n  const form = obj => { const fd = new FormData(); for (const [k, v] of Object.entries(obj)) fd.append(k, v); return fd; };\n\n  /* info() checks the server answers and returns { device, gpu } */\n  const info = base => call(base, '/api/info');\n  const status = base => call(base, '/api/status');\n  const summary = base => call(base, '/api/summary');\n  const cancel = base => call(base, '/api/cancel', { method: 'P target' : ''}<\/title><\/circle>`;\n  }).join('');\n}\n\n/* ---------- Router ---------- */\nlet syncNav = () => {};\nfunction setupNav() {\n  const nav = $('#nav'), box = $('#navLinks'), hl = box.querySelector('.nav-hl'), items = [...box.querySelectorAll('a,button')];\n  const current = box.querySelector('[aria-current]');\n  const rest = () => (current && !current.hidden ? current : null);\n  const to = (el, fresh) => {\n    hl.classList.toggle('fresh', !!fresh); hl.classList.toggle('pressed', el === rest()); hl.style.opacity = 1; hl.style.width = el.offsetWidth + 'px'; hl.style.height = el.offsetHeight + 'px';\n    hl.style.transform = `translate(${el.offsetLeft}px,${el.offsetTop}px)`;\n  };\n  items.forEach(el => el.addEventListener('pointerenter', () => to(el)));\n  box.addEventListener('pointerleave', () => { const r = rest(); if (r) to(r); else hl.style.opacity = 0; });\n  syncNav = () => { const r = rest(); if (r) to(r, true); else hl.style.opacity = 0; };\n  window.addEventListener('resize', syncNav);\n  if (document.fonts) document.fonts.ready.then(syncNav);\n  syncNav();\n  let lastY = scrollY;\n  window.addEventListener('scroll', () => {\n    const y = scrollY; if (Math.abs(y - lastY) < 6) return;\n    nav.classList.toggle('away', y > lastY && y > 140); lastY = y;\n  }, { passive: true });\n}\nlet lastPt = { x: innerWidth / 2, y: innerHeight / 2 };\ndocument.addEventListener('pointerdown', e => { lastPt = { x: e.clientX, y: e.clientY }; }, true);\ndocument.addEventListener('keydown', () => { lastPt = { x: innerWidth / 2, y: innerHeight * .4 }; }, true);\nfunction go(route, opts = {}) {\n  Object.assign(S, { route }, opts); // state moves now; only the DOM swap waits for the transition\n  const swap = () => { render(); window.scrollTo({ top: 0, behavior: 'auto' }); };\n  if (!document.startViewTransition || reduced || document.hidden) { swap(); return; }\n  const { x, y } = lastPt, vt = document.startViewTransition(swap);\n  vt.ready.then(() => {\n    const r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));\n    document.documentElement.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] },\n      { duration: 700, easing: 'cubic-bezier(.23,1,.32,1)', pseudoElement: '::view-transition-new(root)' });\n  }).catch(() => {});\n}\nlet lastRoute = '';\nfunction render() {\n  stopVideo();\n  // Re-rendering the same route (theme change, finished job) skips the entrance choreography\n  const settled = lastRoute === S.route; lastRoute = S.route;\n  document.body.dataset.route = S.route; syncNav();\n  const m = match();\n  view.innerHTML = `<div class=\"view${settled ? ' settled' : ''}\">${({ upload: vUpload, processing: vProcessing, match: vMatch })[S.route]()}<\/div>`;\n  bind();\n  if (S.route === 'processing') updateProcessing();\n}\n\n/* ---------- Screens ---------- */\n/* Upload a file: the upload screen's drop zone or its file picker */\nfunction acceptFile(f) {\n  if (!/^video\\//.test(f.type) && !/\\.(mp4|mov)$/i.test(f.name)) { toast('That file isn\\'t a video. Use an MP4 or MOV.'); return; }\n  takeFile(f.name, f.size, f);\n}\nconst upMeta = u => `${u.size} · ${u.err ? 'Upload failed' : u.p < 1 ? `Uploading ${Math.round(u.p * 100)}%${u.real ? ' to the model' : ''}` : u.real ? 'On the model server' : 'Uploaded'}`;\nfunction paintUpload(u) {\n  if (S.upload !== u || S.route !== 'upload') return;\n  const ring = $('#ring'), meta = $('#upmeta'), b = $('#toConfirm');\n  if (ring) ring.setAttribute('stroke-dashoffset', 94.2 * (1 - u.p));\n  if (meta) meta.textContent = upMeta(u);\n  if (b && u.p >= 1 && !u.err && b.disabled) { b.disabled = false; b.focus(); }\n}\n/* With a file and a connected model server the video really uploads; otherwise (sample clip, no server) the upload is simulated */\nlet uploadCtl = null;\nfunction takeFile(name, bytes, file) {\n  if (uploadCtl) { uploadCtl.abort(); uploadCtl = null; }\n  const real = !!(file && S.engine.ok);\n  const u = S.upload = { name, size: (bytes / 1e9 >= 1 ? (bytes / 1e9).toFixed(2) + ' GB' : Math.max(1, Math.round(bytes / 1e6)) + ' MB'), p: 0, real };\n  if (S.route === 'upload') render(); else go('upload');\n  if (real) {\n    const ctl = uploadCtl = new AbortController();\n    E.upload(S.engine.base, file, p => { u.p = p; paintUpload(u); }, ctl.signal)\n      .catch(err => {\n        if (err.name === 'AbortError') return;\n        console.error(err); u.err = err.message; paintUpload(u);\n        toast(err.status === 409 ? 'The model server is busy with another analysis. Try again when it finishes.' : `Upload failed: ${esc(err.message)}`);\n      });\n    return;\n  }\n  const t0 = performance.now();\n  (function up() {\n    if (S.upload !== u || S.route !== 'upload') return;\n    u.p = Math.min(1, (performance.now() - t0) / 1800);\n    paintUpload(u);\n    if (u.p < 1) requestAnimationFrame(up);\n  })();\n}\nfunction engineRow() {\n  const e = S.engine, state = e.ok ? 'on' : e.err ? 'err' : 'off';\n  const msg = e.checking ? 'Connecting…'\n    : e.ok ? `Connected${e.device ? ' · ' + esc(e.device) : ''}. Videos you add now run on the real model.`\n    : e.err ? esc(e.err)\n    : 'Not connected, so videos run the sample analysis. Paste the engine address to use the real model.';\n  return `<div class=\"engine rise\" data-state=\"${state}\" style=\"--i:3\"><span class=\"engine-dot\" aria-hidden=\"true\"><\/span>\n    <div><b>Model server<\/b><span id=\"engineMsg\" role=\"status\">${msg}<\/span><\/div>\n    <form id=\"engineForm\"><input id=\"engineUrl\" type=\"text\" inputmode=\"url\" placeholder=\"https://….trycloudflare.com\" value=\"${esc(e.base || '')}\" aria-label=\"Model server link\" autocomplete=\"off\" spellcheck=\"false\">\n    <button class=\"key on-light sm\" type=\"submit\" ${e.checking ? 'disabled' : ''}>${e.ok ? 'Reconnect' : 'Connect'}<\/button><\/form><\/div>`;\n}\n\nfunction vUpload() {\n  const u = S.upload;\n  return `<section class=\"hero compact\" ar  style=\"font:inherit\">0<\/b><span>%<\/span><\/p>\n      <span class=\"jbar\"><i id=\"pBar\"><\/i><\/span>\n      <div class=\"run-meta\"><span class=\"num\" id=\"pEta\"><\/span><\/div><\/div>\n    <\/div><\/div><\/section>\n  <section class=\"lib\"><div class=\"lib-wrap\">\n    <ol class=\"psteps rise\" style=\"--i:1\">${STEPS.map((t, i) => `<li class=\"ps wait\" data-ps=\"${i}\"><span class=\"ps-dot\" aria-hidden=\"true\"><\/span>\n      <div><span class=\"ps-label\">${t}<\/span><span class=\"ps-bar\"><i><\/i><\/span><\/div><span class=\"ps-pct num\"><\/span><\/li>`).join('')}<\/ol>\n    <div class=\"proc-actions\">${j.real ? '<button class=\"key soft sm\" id=\"cancelJob\">Cancel analysis<\/button>' : '<a class=\"key soft sm\" href=\"dashboard.html\">Back to dashboard<\/a>'}<\/div>\n  <\/div><\/section>`;\n}\nconst engineEta = j => [j.phase || 'Starting the model', j.fps ? `${j.fps} frames/s` : '', j.eta ? `about ${Math.max(1, Math.round(j.eta / 60))} min left` : ''].filter(Boolean).join(' · ');\nfunction updateProcessing() {\n  const j = S.job, p = j ? j.p : 0;\n  const set = (sel, fn) => { const el = $(sel); if (el) fn(el); };\n  set('#pPct', el => { el.textContent = Math.round(p * 100); });\n  set('#pBar', el => el.style.setProperty('--p', p));\n  set('#pEta', el => { el.textContent = j && j.real ? engineEta(j) : p >= 1 ? 'Finishing up' : `About ${Math.max(1, Math.ceil((1 - p) * 9))} min left · 3,120 frames/min`; });\n  document.querySelectorAll('[data-ps]').forEach(li => {\n    const i = +li.dataset.ps, sp = Math.max(0, Math.min(1, p * STEPS.length - i)), cls = sp >= 1 ? 'done' : sp > 0 ? 'active' : 'wait';\n    li.className = `ps ${cls}`;\n    li.querySelector('.ps-dot').textContent = cls === 'done' ? '✓' : '';\n    li.querySelector('.ps-bar i').style.setProperty('--p', sp);\n    li.querySelector('.ps-pct').textContent = cls === 'done' ? 'Done' : cls === 'active' ? Math.round(sp * 100) + '%' : '';\n  });\n}\n\nfunction tabs(list, cur, name) {\n  return `<div class=\"seg\" role=\"tablist\" data-seg=\"${name}\"><span class=\"pill\"><\/span>${list.map(([k, l]) => `<button role=\"tab\" data-${name}=\"${k}\" aria-selected=\"${k === cur}\">${l}<\/button>`).join('')}<\/div>`;\n}\n\nfunction vMatch() {\n  const m = match();\n  const crest = (t, c) => `<span class=\"crest\" style=\"background:${c}\">${esc(t.split(' ').map(w => w[0]).join('').slice(0, 2))}<\/span>`;\n  const rep = S.real[m.id];   // a model-made report: pitch maps only when its engine sent them\n  const maps = !!(rep && rep.engine && rep.engine.maps);\n  if (rep && !maps && S.tab === 'team') S.tab = 'overview';\n  const body = rep ? ({ overview: vOverviewReal, video: vVideoReal, team: vTeamReal, players: vPlayers })[S.tab](rep, m)\n    : ({ overview: vOverview, video: vVideo, team: vTeam, players: vPlayers })[S.tab]();\n  const tabList = rep ? [['overview', 'Overview'], ['video', 'Video'], ...(maps ? [['team', 'Pitch maps']] : []), ['players', 'Players']]\n    : [['overview', 'Overview'], ['video', 'Video'], ['team', 'Team stats'], ['players', 'Players']];\n  const length = rep ? `${fmtT((rep.engine && rep.engine.duration_s) || 0)} analyzed by the model` : 'Full match · 90:00';\n  return `<section class=\"hero compact slim\"><div class=\"lib-wrap\"><div class=\"match-head\">\n      <div class=\"score\">${crest(m.home, teamColor('home'))}<span class=\"team\">${esc(m.home)}<\/span>\n        <span class=\"big num\">${m.score ? `${m.score[0]} – ${m.score[1]}` : 'vs'}<\/span><span class=\"team\">${esc(m.away)}<\/span>${crest(m.away, teamColor('away'))}<\/div>\n      <span style=\"display:flex;gap:8px\"><button class=\"key soft sm\" id=\"saveTeam\">${ICON.bookmark} Save team<\/button><button class=\"key soft sm\" id=\"export\">${ICON.share} Export<\/button><\/span><\/div>\n    <div class=\"toolbar\">${tabs(tabList, S.tab, 'tab')}\n      <span class=\"muted\">${esc(m.date)} · ${length}<\/span><\/div><\/div><\/section>\n  <section class=\"lib\"><div class=\"lib-wrap\">${body}<\/div><\/section>`;\n}\n\nfunction splitBar(h, a) {\n  const t = h + a;\n  return `<div class=\"split\"><i style=\"width:${t ? h / t * 100 : 50}%;background:${teamColor('home')}\"><\/i><i style=\"flex:1;background:${teamColor('away')}\"><\/i><\/div>`;\n}\nfunction cmpRow(s) {\n  const fmt = v => (s.f === 'time' ? fmtT(v) : (s.d ? v.toFixed(s.d) : v) + (s.u || ''));\n  if (s.view) return `<div class=\"link-row\"><span style=\"color:var(--fg)\">${s.k}${s.txt ? ` <span class=\"muted\">· ${s.txt[0]} / ${s.txt[1]}<\/span>` : ''}<\/span>\n    <button class=\"btn btn-ghost\" data-teamview=\"${s.view}\" style=\"height:28px\">View ${ICON.arrow}<\/button><\/div>`;\n  const mx = Math.max(s.h, s.a) || 1;\n  const label = s.est ? `${s.k} <span class=\"muted\" title=\"Estimated from the broadcast view\">≈<\/span>` : s.k;\n  return `<div class=\"cmp-row\"><div class=\"cmp-top\"><span class=\"l num\">${fmt(s.h)}<\/span><span class=\"c\">${label}<\/span><span class=\"r num\">${fmt(s.a)}<\/span><\/div>\n    <div class=\"cmp-bars\"><div><i data-w=\"${s.h / mx * 100}\" style=\"width:0;background:${teamColor('home')}\"><\/i><\/div><div><i data-w=\"${s.a / mx * 100}\" style=\"width:0;background:${teamColor('away')}\"><\/i><\/div><\/div><\/div>`;\n}\n\nfunction vOverview() {\n  const tile = (label, val, sub, h, a) => `<div class=\"tile\"><span class=\"label\">${label}<\/span>\n    <div class=\"v\"><b class=\"num\">${val}<\/b><span class=\"num\">${sub}<\/span><\/div>${splitBar(h, a)}<\/div>`;\n  const keyStats = ['Possession', 'Passes', 'Pass accuracy', 'Shots', 'Shots on target', 'Distance covered'];\n  const shown = S.showAll ? STATS : STATS.filter(s => keyStats.includes(s.k));\n  let lastG = '';\n  const rows = shown.map(s => { const g = S.showAll && s.g !== lastG ? `<div class=\"label group-title\">${s.g}<\/div>` : ''; lastG = s.g; return g + cmpRow(s); }).join('');\n  const moments = events.filter(e => e.type === 'goal' || e.type === 'shot').map(e => {\n    const isGoal = e.type === 'goal';\n    const m = match();\n    return `<button class=\"moment\" data-seek=\"${e.t.toFixed(1)}\"><span class=\"t num\">${fmtT(e.t)}<\/span>\n      <span class=\"ico\" style=\"background:${teamColor(e.team)}\">${isGoal ? 'G' : ''}<\/span>\n      <span><b style=\"font-weight:600\">${isGoal ? 'Goal' : 'Shot'}<\/b> <span class=\"muted\">#${e.from.jersey} · ${esc(e.team === 'home' ? m.home : m.away)}<\/span><\/span>\n      <span class=\"muted\">${ICON.arrow}<\/span><\/button>`;\n  }).join('');\n  return `<div class=\"tiles\">\n      ${tile('Possession', '56%', 'vs 44%', 56, 44)}\n      ${tile('Shots', '14', '6 on target', 14, 9)}\n      ${tile('Passes', '498', '87% accurate', 498, 391)}\n      ${tile('Distance', '112.4 km', 'vs 109.8', 112.4, 109.8)}\n    <\/div>\n    <div class=\"cols\">\n      <div class=\"card\"><div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px\"><h3>Team comparison<\/h3>\n        <span class=\"muted\" style=\"display:flex;gap:12px\"><span><span class=\"sw\" style=\"background:${teamColor('home')}\"><\/span> ${esc(match().home)}<\/span><span><span class=\"sw\" style=\"background:${teamColor('away')}\"><\/span> ${esc(match().away)}<\/span><\/span><\/div>\n        <div class=\"cmp\">${rows}<\/div>\n        <button class=\"disclose\" id=\"showAll\" aria-expanded=\"${S.showAll}\">${S.showAll ? 'Show key stats only' : 'Show all 20 stats'} ${ICON.chev}<\/button><\/div>\n      <div class=\"stack\">\n        <div class=\"card\"><h3 style=\"margin-bottom:14px\">On the pitch<\/h3><div class=\"mini-pitches\">\n          <button class=\"mini\" data-teamview=\"heat\">${pitch(heatLayer('home'), 'Home heatmap')}<span class=\"muted\">Heatmap · ${esc(match().home)}<\/span><\/button>\n          <button class=\"mini\" data-teamview=\"shots\">${pitch(shotLayer('both'), 'Shot map')}<span class=\"muted\">Shot map · both teams<\/span><\/button><\/div><\/div>\n        <div class=\"card\"><h3 style=\"margin-bottom:6px\">Key moments<\/h3><p class=\"muted\" style=\"margin:0 0 8px\">From the analyzed clip. Select one to watch it.<\/p><div class=\"moments\">${moments}<\/div><\/div>\n      <\/div><\/div>`;\n}\n\n/* Overview of a model-made report: what the engine measured. Older reports have no event stats or maps and say so */\nfunction vOverviewReal(rep) {\n  const val = k => rep.stats[k] || [0, 0], e = rep.engine || {}, ball = e.ball || {}, events = 'Shots' in rep.stats;\n  const tile = (label, val, sub, h, a) => `<div class=\"tile\"><span class=\"label\">${label}<\/span>\n    <div class=\"v\"><b class=\"num\">${val}<\/b><span class=\"num\">${sub}<\/span><\/div>${splitBar(h, a)}<\/div>`;\n  const [poss, passes, acc, dist, top, shots, onT, xg] = ['Possession', 'Passes', 'Pass accuracy', 'Distance covered', 'Top speed', 'Shots', 'Shots on target', 'xG'].map(val);\n  let lastG = '';\n  const rows = E.STAT_DEFS.filter(d => d.k in rep.stats).map(d => {\n    const [h, a] = val(d.k), g = d.g !== lastG ? `<div class=\"label group-title\">${d.g}<\/div>` : '';\n    lastG = d.g; return g + cmpRow({ ...d, h, a });\n  }).join('');\n  const anchored = e.pitch ? numv(e.pitch.anchored_pct) : null;\n  const facts = [['Clip analyzed', fmtT(e.duration_s || 0)], ['Tracker', e.tracker || '—'], ['Wide-angle footage', `${e.wide_pct ?? 0}%`],\n    ['Ball visible', `${ball.visible_pct ?? 0}%`], ['Fastest ball', `${ball.max_kmh ?? 0} km/h`], ['Player tracks', e.tracks ?? 0], ['ID swaps fixed', e.swaps_fixed ?? 0],\n    ...(anchored == null ? [] : [['Pitch anchored on keepers', `${anchored}% of the clip`]])];\n  const second = events\n    ? `${tile('Shots', shots[0], `${onT[0]} on target`, shots[0], shots[1])}${tile('Expected goals', xg[0].toFixed(2), `vs ${xg[1].toFixed(2)}`, xg[0], xg[1])}`\n    : `${tile('Distance', `${dist[0].toFixed(2)} km`, `vs ${dist[1].toFixed(2)}`, dist[0], dist[1])}${tile('Top speed', `${top[0].toFixed(1)} km/h`, `vs ${top[1].toFixed(1)}`, top[0], top[1])}`;\n  const mini = e.maps ? `<div class=\"card\"><h3 style=\"margin-bottom:14px\">On the pitch<\/h3><div class=\"mini-pitches\">\n          <button class=\"mini\" data-teamview=\"heat\">${pitch(heatReal(rep, 'home', 'all'), 'Home heatmap')}<span class=\"muted\">Heatmap · ${esc(match().home)}<\/span><\/button>\n          <button class=\"mini\" data-teamview=\"shots\">${pitch(shotReal(rep, 'both'), 'Shot map')}<span class=\"muted\">Shot map · both teams<\/span><\/button><\/div><\/div>` : '';\n  const note = events\n    ? `<div class=\"card\"><h3 style=\"margin-bottom:6px\">How these are measured<\/h3><p class=\"muted\" style=\"margin:0\">Stats marked ≈ and the pitch maps use estimated pitch positions. The broadcast view isn't calibrated, so the model places players from the camera pan, using player height as a ruler and the goalkeepers as anchors${anchored == null ? '' : ` (${anchored}% of this clip)`}. Shots are fast kicks towards goal from within about 32 m, xG rates each one by distance and angle, and a save is a shot on target that reaches the keeper. Corners and free kicks are kicks taken after the ball sat still. Tackles win the ball within 3 m of its carrier; other regains are interceptions. Defensive contribution adds tackles, interceptions and clearances. Goals aren't detected yet. Goalkeepers only count towards saves and referees are left out.<\/p><\/div>`\n    : `<div class=\"card\"><h3 style=\"margin-bottom:6px\">Not measured yet<\/h3><p class=\"muted\" style=\"margin:0\">This report was made before the model mapped the pitch, so it has no shots, tackles, xG or pitch maps. Analyze the match again to add them. Distances and speeds are estimated using player height as a ruler. Strikes are kicks where the ball went faster than 75 km/h. Goalkeepers and referees are tracked but left out of team totals.<\/p><\/div>`;\n  return `<div class=\"tiles\">\n      ${tile('Possession', `${poss[0]}%`, `vs ${poss[1]}%`, poss[0], poss[1])}\n      ${tile('Passes', passes[0], `${acc[0]}% accurate`, passes[0], passes[1])}\n      ${second}\n    <\/div>\n    <div class=\"cols\">\n      <div class=\"card\"><div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:16px\"><h3>Team comparison<\/h3>\n        <span class=\"muted\" style=\"display:flex;gap:12px\"><span><span class=\"sw\" style=\"background:${teamColor('home')}\"><\/span> ${esc(match().home)}<\/span><span><span class=\"sw\" style=\"background:${teamColor('away')}\"><\/span> ${esc(match().away)}<\/span><\/span><\/div>\n        <div class=\"cmp\">${rows}<\/div><\/div>\n      <div class=\"stack\">\n        ${mini}\n        <div class=\"card\"><h3 style=\"margin-bottom:14px\">From the model<\/h3><dl class=\"facts\">${facts.map(([k, v]) => `<dt>${k}<\/dt><dd class=\"num\">${esc(v)}<\/dd>`).join('')}<\/dl><\/div>\n        ${note}\n      <\/div><\/div>`;\n}\n/* The annotated video lives on the model server, which keeps only its latest analysis */\nfunction vVideoReal(rep, m) {\n  const e = rep.engine || {}, last = latestVideo();\n  const playable = e.base && last && last.matchId === m.id && last.base === e.base;\n  if (!playable) return `<div class=\"card\"><h3 style=\"margin-bottom:6px\">Video not available<\/h3><p class=\"muted\" style=\"margin:0\">The annotated video is stored on the model server that made it, and only for its latest analysis. Analyze the match again with the server running to watch it.<\/p><\/div>`;\n  return `<div class=\"card\"><video class=\"engine-video\" id=\"engineVideo\" controls playsinline preload=\"metadata\" src=\"${esc(E.videoUrl(e.base))}\"><\/video>\n    <p class=\"muted\" style=\"margin:12px 0 0\">Annotated by the model: rings show each player's team, the gold ring and arrow mark the ball carrier, and the bar at the bottom is live possession. It plays while the engine that made it is running.<\/p><\/div>`;\n}\n\n/* Pitch maps of a model-made report. Home attacks left to right; positions are estimated from the broadcast view */\nfunction vTeamReal(rep) {\n  if (!['heat', 'passes', 'shots'].includes(S.teamView)) S.teamView = 'heat';\n  const v = S.teamView, side = S.teamSide, mode = S.heatMode;\n  const inner = v === 'heat' ? heatReal(rep, side, mode) : v === 'passes' ? passReal(rep, side) : shotReal(rep, side);\n  const legends = {\n    heat: mode === 'on' ? 'Where each team had the ball.' : mode === 'off' ? 'Where players were without the ball.' : 'Darker cells mean more time spent in that zone.',\n    passes: `Each line is a completed pass, ending at the dot. ${(rep.engine.maps.passes || []).filter(p => onSide(p[4], side)).length} passes.`,\n    shots: `<span><svg width=\"12\" height=\"12\"><circle cx=\"6\" cy=\"6\" r=\"4.5\" fill=\"var(--fg-2)\"/><\/svg> On target<\/span><span><svg width=\"12\" height=\"12\"><circle cx=\"6\" cy=\"6\" r=\"4.5\" fill=\"none\" stroke=\"var(--fg-2)\"/><\/svg> Off target<\/span><span>Bigger circles mean higher xG.<\/span>`,\n  };\n  return `<div class=\"toolbar\">${tabs([['heat', 'Heatmap'], ['passes', 'Pass map'], ['shots', 'Shot map']], v, 'teamview')}\n      ${tabs([['home', esc(match().home)], ['both', 'Both'], ['away', esc(match().away)]], side, 'side')}\n      ${v === 'heat' ? tabs([['all', 'All'], ['on', 'On the ball'], ['off', 'Off the ball']], mode, 'heatmode') : ''}<\/div>\n    <div class=\"pitch-big\">${pitch(inner, v)}<div class=\"pitch-legend\">${legends[v]}<span>${esc(match().home)} attacks left to right. Positions are estimated from the broadcast view.<\/span><\/div><\/div>`;\n}\n\nfunction vTeam() {\n  const v = S.teamView, side = S.teamSide;\n  const inner = v === 'heat' ? heatLayer(side) : v === 'shots' ? shotLayer(side) : v === 'passes' ? avgLayer(side === 'both' ? 'home' : side, true) : avgLayer(side, false);\n  const legends = {\n    heat: 'Darker cells mean more time spent in that zone.',\n    shots: `<span><svg width=\"12\" height=\"12\"><circle cx=\"6\" cy=\"6\" r=\"4.5\" fill=\"var(--fg-2)\"/><\/svg> On target<\/span><span><svg width=\"12\" height=\"12\"><circle cx=\"6\" cy=\"6\" r=\"4.5\" fill=\"none\" stroke=\"var(--fg-2)\"/><\/svg> Off target<\/span><span><svg width=\"14\" height=\"14\"><circle cx=\"7\" cy=\"7\" r=\"3.5\" fill=\"var(--fg-2)\"/><circle cx=\"7\" cy=\"7\" r=\"6\" fill=\"none\" stroke=\"var(--fg-2)\"/><\/svg> Goal<\/span>`,\n    passes: 'Thicker lines mean more passes between two players. Showing one team at a time.',\n    avg: 'Each dot is a player\\'s average position. Home attacks left to right.',\n  };\n  return `<div class=\"toolbar\">${tabs([['heat', 'Heatmap'], ['passes', 'Pass network'], ['shots', 'Shot map'], ['avg', 'Average positions']], v, 'teamview')}\n      ${tabs([['home', esc(match().home)], ['both', 'Both'], ['away', esc(match().away)]], side, 'side')}<\/div>\n    <div class=\"pitch-big\">${pitch(inner, v)}<div class=\"pitch-legend\">${legends[v]}<\/div><\/div>`;\n}\n\nfunction spark(vals, color) {\n  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 70).toFixed(1)},${(20 - v * 17).toFixed(1)}`).join(' ');\n  return `<svg class=\"spark\" width=\"72\" height=\"22\" viewBox=\"-1 0 73 22\"><polyline points=\"${pts}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"1.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><\/svg>`;\n}\n/* match_players rows from the model -> the shape the players table uses. Tracks have no shirt number, so the track id stands in */\nconst EXTRA_COLS = [['tackles', 'Tackles'], ['dribbles', 'Dribbles'], ['box', 'Box touches'], ['shots', 'Shots'], ['xg', 'xG']];\nconst realPlayers = rep => rep.players.map(r => {\n  const x = (rep.engine && rep.engine.px && rep.engine.px[r.player_key]) || null, ex = k => (x ? numv(x[k]) : null);\n  return { id: r.player_key, team: r.team, jersey: +String(r.player_key).slice(1), pos: 'Track', track: true,\n    distance: r.distance ?? 0, top: r.top_speed ?? 0, sprints: r.sprints ?? 0, passes: r.passes ?? 0, acc: r.accuracy, touches: r.touches ?? 0,\n    ex: x, tackles: ex('tackles'), dribbles: ex('dribbles'), box: ex('box_touches'), shots: ex('shots'), xg: ex('xg') };\n});\nconst playerList = () => { const rep = S.real[S.matchId]; return rep ? realPlayers(rep) : players; };\nfunction vPlayers(rep) {\n  const extra = rep && rep.engine && rep.engine.px ? EXTRA_COLS : [];\n  const cols = [['jersey', 'Player'], ['distance', 'Distance'], ['top', 'Top speed'], ['sprints', 'Sprints'], ['passes', 'Passes'], ['acc', 'Accuracy'], ['touches', 'Touches'], ...extra];\n  const list = [...playerList()].sort((a, b) => ((a[S.sort.k] ?? -1) - (b[S.sort.k] ?? -1)) * S.sort.dir);\n  const m = match();\n  if (rep && !list.length) return `<div class=\"card\"><p class=\"muted\" style=\"margin:0\">The model didn't keep any player on screen long enough to list. Wide broadcast footage works best.<\/p><\/div>`;\n  return `<div class=\"table-wrap\"><table><thead><tr>${cols.map(([k, l], i) => `<th class=\"${i ? 'r' : ''}\" ${S.sort.k === k ? `aria-sort=\"${S.sort.dir > 0 ? 'ascending' : 'descending'}\"` : ''}><button data-sort=\"${k}\">${l}${S.sort.k === k ? (S.sort.dir > 0 ? ' ↑' : ' ↓') : ''}<\/button><\/th>`).join('')}${rep ? '' : '<th>Intensity<\/th>'}<\/tr><\/thead>\n    <tbody>${list.map(p => `<tr data-player=\"${esc(p.id)}\" tabindex=\"0\"><td><div class=\"pcell\"><span class=\"jersey\" style=\"background:${teamColor(p.team)}\">${p.jersey}<\/span><span><b style=\"font-weight:600\">${p.pos}${p.track ? ' ' + p.jersey : ''}<\/b> <span class=\"muted\">${esc(p.team === 'home' ? m.home : m.away)}<\/span><\/span><\/div><\/td>\n      <td class=\"r num\">${p.distance.toFixed(p.track ? 2 : 1)} km<\/td><td class=\"r num\">${p.top.toFixed(1)} km/h<\/td><td class=\"r num\">${p.sprints}<\/td><td class=\"r num\">${p.passes}<\/td><td class=\"r num\">${p.acc == null ? '—' : p.acc + '%'}<\/td><td class=\"r num\">${p.touches}<\/td>\n      ${extra.map(([k]) => `<td class=\"r num\">${p[k] == null ? '—' : k === 'xg' ? p[k].toFixed(2) : p[k]}<\/td>`).join('')}\n      ${rep ? '' : `<td>${spark(p.spark, teamColor(p.team))}<\/td>`}<\/tr>`).join('')}<\/tbody><\/table><\/div>\n    <p class=\"muted\" style=\"margin-top:12px\">${rep ? `From the model. Players are listed by tracking id because shirt numbers aren't read yet, so one player can appear under two ids after leaving the frame. Goalkeepers and referees aren't listed.${extra.length ? ' Tackles, dribbles, box touches, shots and xG are estimates. Select a player for the rest and a heatmap.' : ''}`\n      : 'Sample data. Players are identified by shirt number and position.'}<\/p>`;\n}\n\nfunction vVideo() {\n  const v = S.video;\n  const evs = events.filter(e => e.type !== 'pass');\n  const colorFor = e => e.type === 'goal' ? 'var(--ball)' : e.type === 'shot' ? teamColor(e.team) : 'rgba(255,255,255,.75)';\n  return `<div class=\"video-wrap\">\n    <div class=\"stage\">\n      <canvas id=\"cv\" aria-label=\"Annotated match video simulation\"><\/canvas>\n      <div class=\"overlay-bar\"><div class=\"glass toggles\">${[['boxes', 'Boxes'], ['ids', 'IDs'], ['trail', 'Ball trail'], ['mini', 'Minimap']].map(([k, l]) => `<button data-ov=\"${k}\" aria-pressed=\"${v.overlays[k]}\">${l}<\/button>`).join('')}<\/div>\n        <span class=\"glass sim-note\">Simulated footage · sample clip<\/span><\/div>\n      <div class=\"controls\">\n        <div class=\"ctrl-row\"><button class=\"play\" id=\"play\" aria-label=\"Play\">${ICON.play}<\/button>\n          <div class=\"timeline\" id=\"tl\" role=\"slider\" tabindex=\"0\" aria-label=\"Seek\" aria-valuemin=\"0\" aria-valuemax=\"${CLIP}\">\n            <div class=\"tl-track\"><\/div>\n            ${events.filter(e => e.type === 'pass').map(e => `<i class=\"tl-tick\" style=\"left:${e.t / CLIP * 100}%\"><\/i>`).join('')}\n            <div class=\"tl-fill\" id=\"tlfill\"><\/div>\n            ${evs.map(e => `<i class=\"tl-ev\" style=\"left:${e.t / CLIP * 100}%;background:${colorFor(e)}\" title=\"${e.type} ${fmtT(e.t)}\"><\/i>`).join('')}\n            <div class=\"tl-head\" id=\"tlhead\"><\/div>\n          <\/div><span class=\"time num\" id=\"time\"><\/span><\/div>\n        <div class=\"legend\"><span><i class=\"sw\" style=\"background:var(--ball)\"><\/i>Goal<\/span><span><i class=\"sw\" style=\"background:${teamColor('home')}\"><\/i>Shot · home<\/span><span><i class=\"sw\" style=\"background:${teamColor('away')}\"><\/i>Shot · away<\/span><span><i class=\"sw\" style=\"background:rgba(255,255,255,.75)\"><\/i>Interception<\/span><span><i class=\"sw\" style=\"background:rgba(255,255,255,.3)\"><\/i>Pass<\/span><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"side\">\n      <div class=\"card\"><span class=\"label\">At this moment<\/span><div class=\"event-now\" id=\"evnow\" style=\"margin-top:8px\"><\/div>\n        <div style=\"margin-top:12px;display:grid;gap:8px\"><div class=\"cmp-top\" style=\"grid-template-columns:44px 1fr 44px\"><span class=\"l num\" id=\"posH\"><\/span><span class=\"c\">Possession so far<\/span><span class=\"r num\" id=\"posA\"><\/span><\/div><div id=\"posBar\"><\/div>\n        <div class=\"cmp-top\" style=\"grid-template-columns:44px 1fr 44px\"><span class=\"l num\" id=\"pasH\"><\/span><span class=\"c\">Passes so far<\/span><span class=\"r num\" id=\"pasA\"><\/span><\/div><\/div><\/div>\n      <div class=\"card\" id=\"selCard\"><\/div>\n      <div class=\"card kbd\"><kbd>Space<\/kbd> play or pause · <kbd>←<\/kbd> <kbd>→<\/kbd> 5 s · <kbd>J<\/kbd> <kbd>K<\/kbd> previous or next event<\/div>\n    <\/div><\/div>`;\n}\n\n/* ---------- Video engine ---------- */\nlet raf = 0, lastTs = 0, cv, ctx, cw = 0;\nfunction stopVideo() { cancelAnimationFrame(raf); raf = 0; S.video.playing = false; ctx = null; cw = 0; }\nfunction setupVideo() {\n  cv = $('#cv'); if (!cv) return; ctx = cv.getContext('2d');\n  const size = () => { if (!ctx) return; const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cw = r.width; cv.width = r.width * d; cv.height = r.width * 68 / 105 * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw(); };\n  new ResizeObserver(size).observe gine, follow its progress, then save the report to Supabase */\nconst POLL_MS = 2000, MAX_POLL_FAILS = 15;   // ~30 s of lost contact before giving up\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nasync function runEngineJob(m, opts, created) {\n  const base = S.engine.base, title = `${m.home} vs ${m.away}`;\n  const open = () => go('match', { matchId: m.id, tab: 'overview', showAll: false });\n  let report;\n  try {\n    await E.start(base, { mode: opts.mode });\n    for (let fails = 0; ;) {\n      await sleep(POLL_MS);\n      let st;\n      try { st = await E.status(base); fails = 0; } catch (err) { if (++fails >= MAX_POLL_FAILS) throw err; continue; }\n      if (st.status === 'error') throw new Error(st.error_msg || 'The model couldn\\'t analyze this video.');\n      if (st.status === 'cancelled') throw new Error('The analysis was cancelled.');\n      if (S.job && S.job.id === m.id) {\n        S.job = { ...S.job, p: E.phaseStep(st), phase: st.phase, fps: st.fps, eta: st.eta };\n        if (S.route === 'processing') updateProcessing();\n      }\n      if (st.status === 'completed') break;\n    }\n    report = E.toReport(await E.summary(base), opts.homeKit, base);\n  } catch (err) {\n    console.error(err);\n    m.status = 'failed';\n    if (S.job && S.job.id === m.id) S.job = { ...S.job, running: false };\n    created.then(ok => ok && save('matches', 'PATCH', `?id=eq.${m.id}`, { status: 'failed' }));\n    toast(`Analysis failed: ${esc(err.message)}`);\n    if (S.route === 'processing') go('upload');\n    return;\n  }\n  S.real[m.id] = report; m.status = 'ready';\n  if (S.job && S.job.id === m.id) S.job = { ...S.job, running: false };\n  rememberVideo(m.id, base);\n  if (S.route === 'processing') open();\n  try {\n    if (!(await created)) throw new Error('The match row was never created');\n    // Players first: the row only turns \"ready\" once everything the report needs is saved\n    if (report.players.length) await db('match_players', 'POST', '', report.players.map(p => ({ match_id: m.id, ...p })));\n    await db('matches', 'PATCH', `?id=eq.${m.id}`, { status: 'ready', stats: report.stats, engine: report.engine });\n  } catch (err) {\n    console.error(err);\n    toast(/jersey|engine|PGRST204|23502/.test(err.message) ? 'The stats are ready but the database needs supabase/engine.sql run first.'\n      : 'The stats are ready but couldn\\'t be saved to the cloud.', 'View stats', open);\n    return;\n  }\n  logActivity('ready', title);\n  toast(`${esc(title)} is ready`, 'View stats', open);\n}\n\nconst extraTiles = x => (!x ? '' : [[x.tackles, 'tackles'], [x.interceptions, 'interceptions'], [x.clearances, 'clearances'], [x.dribbles, 'dribbles'],\n  [x.dispossessed, 'times dispossessed'], [x.box_touches, 'touches in the box'], [x.shots, `shots, ${numv(x.shots_on)} on target`], [numv(x.xg).toFixed(2), 'xG'],\n  [x.crosses, 'crosses'], [x.long_balls, `long balls, ${numv(x.long_balls_att)} tried`], [fmtT(numv(x.final_third_s)), 'in the final third'],\n  [numv(x.sprint_kmh).toFixed(1), 'avg sprint, km/h']].map(([v, l]) => `<div><b class=\"num\">${esc(typeof v === 'string' ? v : numv(v))}<\/b><span>${esc(l)}<\/span><\/div>`).join(''));\nfunction playerHeat(p, c) {\n  const x = p.ex, rep = S.real[S.matchId], size = (rep && rep.engine && rep.engine.maps && rep.engine.maps.player_size) || [12, 8];\n  if (!x || !Array.isArray(x.heat) || !x.heat.some(v => numv(v) > 0)) return '';\n  return `<div class=\"pitch-big\" style=\"margin:0 0 14px\">${pitch(gridLayer(x.heat, size[0], size[1], c, .85), `Heatmap of track ${p.jersey}`)}\n    <div class=\"pitch-legend\"><span>Heatmap · ${esc(match().home)} attacks left to right<\/span><\/div><\/div>`;\n}\n/* A model-made player: the numbers the engine measured, plus estimated event stats and a heatmap when the engine sent them */\nfunction trackSheet(p) {\n  const m = match(), c = teamColor(p.team);\n  openSheet(`<div class=\"sheet-head\"><div class=\"pinfo\"><span class=\"jersey\" style=\"background:${c}\">${p.jersey}<\/span><div><h2>Track ${p.jersey}<\/h2><div class=\"muted\">${esc(p.team === 'home' ? m.home : m.away)}<\/div><\/div><\/div>\n    <button class=\"btn btn-ghost\" id=\"cancelSheet\">Done<\/button><\/div>\n    <div class=\"stat-tiles\"><div><b class=\"num\">${p.distance.toFixed(2)}<\/b><span>km covered<\/span><\/div><div><b class=\"num\">${p.top.toFixed(1)}<\/b><span>top speed, km/h<\/span><\/div><div><b class=\"num\">${p.sprints}<\/b><span>sprints<\/span><\/div>\n      <div><b class=\"num\">${p.passes}<\/b><span>passes<\/span><\/div><div><b class=\"num\">${p.acc == null ? '—' : p.acc + '%'}<\/b><span>pass accuracy<\/span><\/div><div><b class=\"num\">${p.touches}<\/b><span>touches<\/span><\/div>${extraTiles(p.ex)}<\/div>\n    ${playerHeat(p, c)}\n    <p class=\"muted\" style=\"margin:0\">Measured by the model while this track was on screen${p.ex ? '; everything after touches is estimated from the broadcast view' : ''}. Saving players needs shirt numbers, which the model doesn't read yet.<\/p>`, `Track ${p.jersey}`);\n  $('#cancelSheet').onclick = closeSheet;\n}\n\nfunction playerSheet(id) {\n  if (S.real[S.matchId]) { const t = playerList().find(x => x.id === id); if (t) trackSheet(t); return; }\n  const p = players.find(x => x.id === id), m = match(), c = teamColor(p.team);\n  const g = heatGrid([p], 8);\n  const heat = g.filter(x => x.v > .12).map(x => `<rect x=\"${x.i * 5}\" y=\"${(x.j * H / 14).toFixed(2)}\" width=\"5\" height=\"${(H / 14).toFixed(2)}\" fill=\"${c}\" fill-opacity=\"${(x.v * .85).toFixed(2)}\"/>`).join('');\n  const sp = p.spark.map((v, i) => `${(i / 11 * 100).toFixed(1)},${(36 - v * 30).toFixed(1)}`).join(' ');\n  openSheet(`<div class=\"sheet-head\"><div class=\"pinfo\"><span class=\"jersey\" style=\"background:${c}\">${p.jersey}<\/span><div><h2>${p.pos} · #${p.jersey}<\/h2><div class=\"muted\">${esc(p.team === 'home' ? m.home : m.away)}<\/div><\/div><\/div>\n    <span style=\"display:flex;gap:8px\"><button class=\"btn btn-ghost\" id=\"savePlayer\">Save player<\/button><button class=\"btn btn-ghost\" id=\"cancelSheet\">Done<\/button><\/span><\/div>\n    <div class=\"stat-tiles\"><div><b class=\"num\">${p.distance.toFixed(1)}<\/b><span>km covered<\/span><\/div><div><b class=\"num\">${p.top.toFixed(1)}<\/b><span>top speed, km/h<\/span><\/div><div><b class=\"num\">${p.sprints}<\/b><span>sprints<\/span><\/div>\n      <div><b class=\"num\">${p.passes}<\/b><span>passes<\/span><\/div><div><b class=\"num\">${p.acc}%<\/b><span>pass accuracy<\/span><\/div><div><b class=\"num\">${p.touches}<\/b><span>touches<\/span><\/div><\/div>\n    <span class=\"label\">Heatmap<\/span><div style=\"margin:10px 0 18px\">${pitch(heat, 'Player heatmap')}<\/div>\n    <span class=\"label\">Intensity by 15-minute block<\/span>\n    <svg viewBox=\"-2 0 104 40\" style=\"width:100%;height:auto;margin-top:10px\"><line x1=\"0\" y1=\"36\" x2=\"100\" y2=\"36\" stroke=\"var(--line)\"/><polygon points=\"0,36 ${sp} 100,36\" fill=\"${c}\" fill-opacity=\".15\"/><polyline points=\"${sp}\" fill=\"none\" stroke=\"${c}\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><\/svg>`, `Player ${p.jersey}`);\n  $('#cancelSheet').onclick = closeSheet;\n  const teamName = p.team === 'home' ? m.home : m.away, opponent = p.team === 'home' ? m.away : m.home;\n  $('#savePlayer').onclick = () => bookmark('saved_players', {\n    match_ref: m.id, player_key: p.id, team_name: teamName, jersey: p.jersey, pos: p.pos, distance: round(p.distance, 1), top_speed: round(p.top, 1), sprints: p.sprints,\n    spark: p.spark.map(v => round(v, 3)), spark_label: 'Intensity per 15 min', opponent, match_day: m.day,\n  }, 'player', `#${p.jersey} · ${teamName}`);\n}\n\nfunction saveTeamSheet() {\n  const m = match();\n  openSheet(`<div class=\"sheet-head\"><h2>Save a team<\/h2><button class=\"btn btn-ghost\" id=\"cancelSheet\">Done<\/button><\/div>\n    <p class=\"muted\" style=\"margin:-8px 0 20px\">Saved teams appear on your dashboard with their form across every analyzed match.<\/p>\n    <div class=\"opt-grid\">\n      <button class=\"opt\" data-saveteam=\"home\"><b>${esc(m.home)}<\/b><span>Home team<\/span><\/button>\n      <button class=\"opt\" data-saveteam=\"away\"><b>${esc(m.away)}<\/b><span>Away team<\/span><\/button>\n    <\/div>`, 'Save a team');\n  $('#cancelSheet').onclick = closeSheet;\n  document.querySelectorAll('[data-saveteam]').forEach(b => b.onclick = () => {\n    const name = b.dataset.saveteam === 'home' ? m.home : m.away;\n    closeSheet(); bookmark('saved_teams', { name }, 'team', name);\n  });\n}\n\nfunction exportSheet() {\n  openSheet(`<div class=\"sheet-head\"><h2>Export<\/h2><button class=\"btn btn-ghost\" id=\"cancelSheet\">Done<\/button><\/div>\n    <div class=\"opt-grid\">\n      <button class=\"opt\" data-exp=\"PDF report\"><b>PDF report<\/b><span>All 20 stats and pitch maps<\/span><\/button>\n      <button class=\"opt\" data-exp=\"CSV\"><b>Stats as CSV<\/b><span>Team and player tables<\/span><\/button>\n      <button class=\"opt\" data-exp=\"Annotated video\"><b>Annotated video<\/b><span>MP4 with tracking overlays<\/span><\/button>\n      <button class=\"opt\" data-exp=\"link\"><b>Copy share link<\/b><span>Read-only link to this match<\/span><\/button>\n    <\/div>`, 'Export');\n  $('#cancelSheet').onclick = closeSheet;\n  document.querySelectorAll('[data-exp]').forEach(b => b.onclick = () => { closeSheet(); toast(b.dataset.exp === 'link' ? 'Link copied (prototype)' : `${b.dataset.exp} is not connected in this prototype`); });\n}\n\nlet toastT;\nfunction toast(msg, action, fn) {\n  const el = $('#toast');\n  el.innerHTML = `<span>${msg}<\/span>${action ? `<button class=\"btn btn-primary\" id=\"toastBtn\">${action}<\/button>` : ''}`;\n  el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), action ? 6000 : 2800);\n  if (action) $('#toastBtn').onclick = () => { el.classList.remove('show'); fn(); };\n}\n\n/* ---------- Bindings ---------- */\nfunction placePills() {\n  document.querySelectorAll('.seg').forEach(seg => {\n    const on = seg.querySelector('[aria-selected=\"true\"]'), pill = seg.querySelector('.pill'); if (!on) return;\n    pill.style.left = on.offsetLeft + 'px'; pill.style.width = on.offsetWidth + 'px';\n  });\n}\nfunction bind() {\n  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));\n  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {\n    const m = S.matches.find(x => x.id === b.dataset.open);\n    if (m.status === 'ready') go('match', { matchId: m.id, tab: 'overview', showAll: false }); else go('processing');\n  });\n  document.querySelectorAll('.toolbar [data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });\n  document.querySelectorAll('.toolbar [data-teamview]').forEach(b => b.onclick = () => { S.teamView = b.dataset.teamview; render(); });\n  document.querySelectorAll(':not(.toolbar) > [data-teamview], .mini[data-teamview], .link-row [data-teamview]').forEach(b => b.onclick = () => { S.teamView = b.dataset.teamview; S.tab = 'team'; render(); window.scrollTo({ top: 0 }); });\n  document.querySelectorAll('[data-side]').forEach(b => b.onclick = () => { S.teamSide = b.dataset.side; render(); });\n  document.querySelectorAll('[data-heatmode]').forEach(b => b.onclick = () => { S.heatMode = b.dataset.heatmode; render(); });\n  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { const k = b.dataset.sort; S.sort = { k, dir: S.sort.k === k ? -S.sort.dir : -1 }; render(); });\n  document.querySelectorAll('tr[data-player]').forEach(r => { r.onclick = () => playerSheet(r.dataset.player); r.onkeydown = e => { if (e.key === 'Enter') playerSheet(r.dataset.player); }; });\n  document.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => { S.video.t = Math.max(0, +b.dataset.seek - 2); S.tab = 'video'; render(); });\n  const sa = $('#showAll'); if (sa) sa.onclick = () => { S.showAll = !S.showAll; render(); };\n  const ex = $('#export'); if (ex) ex.onclick = exportSheet;\n  const st = $('#saveTeam'); if (st) st.onclick = saveTeamSheet;\n  document.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => { const k = b.dataset.ov; S.video.overlays[k] = !S.video.overlays[k]; b.setAttribute('aria-pressed', S.video.overlays[k]); draw(); });\n  const sc = $('#selCard'); if (sc) sc.onclick = e => { const b = e.target.closest('[data-player]'); if (b) playerSheet(b.dataset.player); };\n  // upload\n  const drop = $('#drop');\n  if (drop) {\n    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));\n    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));\n    drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) acceptFile(f); });\n    $('#file').onchange = e => { const f = e.target.files[0]; if (f) acceptFile(f); };\n    $('#sample').onclick = () => takeFile('trivela-sample-broadcast.mp4', 1.28e9);\n    const tc = $('#toConfirm'); if (tc) tc.onclick = confirmSheet;\n  }\n  const ef = $('#engineForm'); if (ef) ef.onsubmit = e => { e.preventDefault(); connectEngine($('#engineUrl').value); };\n  const cj = $('#cancelJob');\n  if (cj) cj.onclick = () => { cj.disabled = true; E.cancel(S.engine.base).catch(err => { console.error(err); cj.disabled = false; toast(`Couldn't cancel: ${esc(err.message)}`); }); };\n  const ev = $('#engineVideo'); if (ev) ev.onerror = () => toast('The video is no longer on the model server. Is the engine still running?');\n  placePills();\n  if (S.route === 'match' && S.tab === 'video') setupVideo();\n  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.cmp-bars i[data-w]').forEach(i => i.style.width = i.dataset.w + '%')));\n}\n\ndocument.addEventListener('keydown', e => {\n  if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }\n  if (!(S.route === 'match' && S.tab === 'video') || S.real[S.matchId] || /input|textarea/i.test(e.target.tagName) || !$('#sheet').hidden) return;\n  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }\n  else if (e.key === 'ArrowRight') { S.video.t = Math.min(CLIP, S.video.t + 5); draw(); }\n  else if (e.key === 'ArrowLeft') { S.video.t = Math.max(0, S.video.t - 5); draw(); }\n  else if (e.key.toLowerCase() === 'k') jumpEvent(1);\n  else if (e.key.toLowerCase() === 'j') jumpEvent(-1);\n});\nwindow.addEventListener('resize', placePills);\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());\nnew MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });\n\n/* A link to a saved analysis loads it before the first paint; anything else falls back to the sample report */\nasync function openLinked(id) {\n  try {\n    const [row] = await db('matches', 'GET', `?id=eq.${id}&select=*`);\n    if (!row) toast('That analysis wasn\\'t found. Showing the sample match.');\n    else if (row.status !== 'ready') { S.route = 'upload'; toast(`${esc(row.home)} vs ${esc(row.away)} ${row.status === 'failed' ? 'didn\\'t finish analyzing. Try uploading it again.' : 'is still analyzing.'}`); }\n    else {\n      if (row.engine) {   // made by the model: its player rows are the report's players\n        const rows = await db('match_players', 'GET', `?match_id=eq.${id}&select=*`);\n        S.real[row.id] = { stats: row.stats || {}, players: rows || [], engine: row.engine };\n      }\n      S.matches.unshift(fromRow(row)); S.matchId = row.id;\n    }\n  } catch (err) { console.error(err); toast('Couldn\\'t load that analysis. Showing the sample match.'); }\n  render();\n}\n\nsetupNav();\nif (LINKED) openLinked(LINKED); else render();\nif (S.engine.base) connectEngine(S.engine.base, true);\n/* ---------- Recent analyses menu (upload screen's nav button): last 3 from the cloud, sample matches if offline ---------- */\n(() => {\n  const wrap = $('#recent'), btn = $('#recentBtn'), menu = $('#recentMenu');\n  const SAMPLES = [\n    { id: '', home: 'Harbor City', away: 'Northgate United', date: 'Sep 28', ready: true, score: [2, 1] },\n    { id: '', home: 'Northgate United', away: 'Eastport Athletic', date: 'Sep 21', ready: true, score: [0, 0] },\n    { id: '', home: 'Harbor City', away: 'Lakeside Rovers', date: 'Sep 14', ready: true, score: [3, 2] }];\n  const dayOf = iso => { const d = new Date(iso); return d.toDateString() === new Date().toDateString() ? 'Today' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };\n  const fromRow = r => ({ id: r.id, home: r.home, away: r.away, date: dayOf(r.created_at), ready: r.status === 'ready', score: [r.home_score ?? 0, r.away_score ?? 0] });\n  let items = null;\n  const open = v => { menu.hidden = !v; btn.setAttribute('aria-expanded', v); };\n  const paint = () => {\n    menu.innerHTML = (items.length ? items.map((m, i) => `<button class=\"recent-item\" role=\"menuitem\" data-i=\"${i}\"><span><b>${esc(m.home)} ${m.ready ? m.score[0] + '–' + m.score[1] : 'vs'} ${esc(m.away)}<\/b><small>${esc(m.date)}<\/small><\/span><span class=\"recent-chip${m.ready ? '' : ' busy'}\">${m.ready ? 'Ready' : 'Analyzing'}<\/span><\/button>`).join('')\n      : '<div class=\"recent-empty\">No analyses yet.<\/div>') + '<a class=\"recent-all\" role=\"menuitem\" href=\"dashboard.html#analyses\">See all analyses<\/a>';\n  };\n  const load = async () => {\n    if (items) return;\n    try { items = (await db('matches', 'GET', '?select=*&order=created_at.desc&limit=3')).map(fromRow); } catch (err) { console.error(err); items = []; }\n    if (!items.length) items = SAMPLES;\n    paint();\n  };\n  const show = () => { wrap.hidden = S.route !== 'upload'; if (wrap.hidden) open(false); };\n  btn.onclick = async () => { if (menu.hidden) { menu.innerHTML = '<div class=\"recent-empty\">Loading…<\/div>'; open(true); await load(); } else open(false); };\n  menu.onclick = e => {\n    const b = e.target.closest('[data-i]'); if (!b) return;\n    const m = items[+b.dataset.i]; open(false);\n    if (!m.ready) { go('processing'); return; }\n    location.hash = m.id ? '#report/' + m.id : '#report'; location.reload();\n  };\n  document.addEventListener('pointerdown', e => { if (!wrap.contains(e.target)) open(false); });\n  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { open(false); btn.focus(); } });\n  const base = render; render = () => { base(); show(); };\n  show();\n})();\n})();\n<\/script>\n"};
(function () {
  var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
  var saved = null; try { saved = sessionStorage.getItem('trivela.page'); } catch (_) {}
  var page = (history.state && history.state.page) || (nav.type === 'reload' ? saved : 'index');
  if (!PAGES[page]) page = 'index';
  try { sessionStorage.setItem('trivela.page', page); } catch (_) {}
  document.open(); document.write(PAGES[page]); document.close();
  var chatScript = document.createElement('script'); chatScript.src = '/chat.js'; document.body.appendChild(chatScript);
})();
